  state-sun-below_horizon-color: var(--rgb-state-default-color)
  state-switch-active-color: var(--state-active-color)
  state-update-active-color: var(--state-active-color)
  state-vacuum-active-color: var(--state-active-color)
  state-sensor-battery-high-color: var(--rgb-state-default-color)
  state-sensor-battery-low-color: var(--rgb-state-default-color)
  state-sensor-battery-medium-color: var(--rgb-state-default-color)

  #font
  primary-font-family: SF Pro Text, Roboto, system-ui
  # `paper-font-*_-_font-family` and `mdc-typography*-font-family` were replaced by
  # the `--ha-font-family-*` variables.
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-code: var(--primary-font-family)
  ha-card-header-font-family: var(--primary-font-family)
  # Section titles. Every `type: grid` / stack card renders its title as
  # `h1.card-header` inside `hui-stack-card`'s shadow root. These theme keys
  # set the title size and colour directly. The old 2.4vw looked right for the
  # dashboard section titles but made popup card headers ("Czujniki", etc.) too
  # large, so cap the size at 24px while keeping a vw ramp on the tablet.
  ha-card-header-font-size: clamp(18px, 1.6vw, 24px)
  ha-card-header-color: rgba(255, 255, 255, 0.8)

  #custom variables
  ha-card-background-color: rgba(34,38,39,0.9)
  ha-card-header-background-color: rgba(48,52,52,0.8)
  custom-layout-card-padding: 3.3vw

  sidebar-time-font-size: 5.2vw
  sidebar-time-line-height: 4.3vw
  sidebar-font-size: 1.42vw
  sidebar-line-height: 2vw
  bar-card-color: "#303435"

  #button_card_templates
  button-card-font-size: 1.35vw
  z-axis-adjustment: 0.05vw #tilt compensation
  button-card-font-weight: 500
  button-card-letter-spacing: -0.02vw
  button-card-border-radius: 10%

  footer-card-font-size: 1.22vw
  footer-card-icon-size: 1.5vw
  footer-card-padding-v: 0.7vw
  footer-card-padding-h: 1.1vw
  footer-card-border-radius: 0.65vw

  footer-notify-font-size: 0.9vw
  footer-notify-box-size: 1.8vw
  footer-notify-top: -0.9vw
  footer-notify-right: -1vw

  button-card-light-color-temp: hsl(204, 58%, 38%)

  #browser_mod.popup
  dialog-backdrop-filter: blur(2em) brightness(0.75)
  # Same thing under the variable the current dialog actually reads for the scrim, since
  # the one above is the legacy spelling (`--ha-dialog-scrim-backdrop-filter` wins over
  # `--dialog-backdrop-filter` when both are present).
  ha-dialog-scrim-backdrop-filter: blur(2em) brightness(0.75)
  popup-background-color: rgba(34,38,39,0.9)
  popup-border-radius: 1em
  popup-padding-x: 0px
  popup-padding-y: 0px
  # browser_mod builds the dialog width from `--popup-width`, which it declares itself as
  # `var(--popup-min-width, 580px)` on the dialog - so this key IS the width.
  #
  # The tablet is 1200x1920 portrait. `66vw` there is only 792px, which was too narrow
  # for the two/three-column popups (some grids are 1000px+). Use almost the full
  # viewport width on the tablet, but cap the width at 1100px so popups do not become
  # comically wide on the 1614px landscape screen. `min(..., 95vw)` keeps a small
  # margin so the dialog never leaves the viewport. `fullscreen` popups are untouched:
  # browser_mod declares `--popup-width: 100vw` for that style itself, so the cameras
  # still fill the screen.
  popup-min-width: min(max(92vw, 800px), 95vw, 1100px)
  popup-width-full: min(max(92vw, 800px), 95vw, 1100px)
  popup-max-width: min(max(92vw, 800px), 95vw, 1100px)
  # Height is content-sized; browser_mod's own `--popup-max-height` caps it.
  #
  # NARROWER POPUPS: the three keys above are global, so a per-popup width needs a
  # browser_mod *popup style* selected with `initial_style:` (`size:` is the pre-2.6
  # spelling; `style:` is the deprecated one-off CSS). There is **no** place to define
  # popup styles globally - browser_mod has no YAML config (`CONFIG_SCHEMA =
  # cv.empty_config_schema`), nothing named `popup_styles` exists in its backend, and the
  # frontend simply does `this._popupStyles = <popup parameter>`. So the styles are
  # declared inline in the popup that uses them; see popup/footer_updates.yaml
  # (`narrow`, 560px) and popup/footer_settings.yaml (`narrower`, 460px).
  #
  # Two things that bite:
  # * browser_mod injects a style's `styles` CSS as `:host([<style>]) { ... }`, so it must
  #   be *declarations only* - selectors there would rely on browser CSS nesting.
  # * Nothing inside the popup declares `--popup-min-width`, `--popup-max-width` or
  #   `--popup-width-full` itself, so overriding them on the popup host (they inherit down
  #   to the dialog) needs no `!important`. That is the lever: browser_mod's own
  #   unconditional rule is
  #   `ha-dialog, ha-adaptive-dialog { --popup-width: var(--popup-min-width, 580px);
  #   --ha-dialog-width-full: var(--popup-width-full, min(95vw, var(--safe-width)));
  #   --ha-dialog-max-width: var(--popup-max-width, 600px); ... }`
  # * `style_sequence` is the tap-the-title cycle; the default is `wide` -> `normal`, so
  #   without setting it the first title tap blows a narrow popup back up to ~92vw.

  # The dialog surface colour, as plain theme variables. `ha-dialog` reads
  # `--ha-dialog-surface-background`; the current frontend's dialog then passes that into
  # Web Awesome's `--wa-color-surface-raised`, which is what actually paints the panel -
  # set both, because which one wins differs between frontend builds and leaving the
  # surface unpainted is what made the popups see-through against the dashboard.
  ha-dialog-surface-background: var(--popup-background-color)
  wa-color-surface-raised: var(--popup-background-color)
  # `popup-border-width` was dropped: nothing reads it any more.
  tablet-popup-header-color: rgba(200, 218, 222, 0.05)
  tablet-popup-content-padding: 1.1em 2.2em 1.6em 1.5em
  tablet-popup-button-padding: 0.1em 2em 1.8em 2em
  tablet-popup-border-style: 1.5px solid rgba(0,0,0,0.2)
  # `tablet-popup-align-dialog`/`tablet-popup-margin-top` set `--vertical-align-dialog`
  # (gone) and a 0px top margin. The dialog is centred again below, which is what
  # `--vertical-align-dialog: center` did and what HA itself defaults to
  # (`margin-top: auto`); browser_mod's own default is 40px from the top.
