tablet:
  #enable mode
  modes: { dark: { .: . } }

  #edited default dark mode
  ha-card-box-shadow: none
  ha-card-background: none

  # HA's `hui-grid-card` does `#root { grid-gap: var(--grid-card-gap, 8px) }`. A
  # PERCENTAGE row-gap resolves to 0 during intrinsic sizing and is only applied in
  # the final layout, so a grid reports a content height ~5% smaller than what it
  # actually lays out to. The layout sizes its row from that smaller number and the
  # swipe-card (pinned to 100% of the cell) clips the difference. A length is
  # accounted for correctly; 1vw is ~5% of a cell in this layout, so the spacing is
  # unchanged (measured: 5% of a 319px grid = 15.95px, 1vw at 1614px = 16.14px).
  grid-card-gap: 1vw
  masonry-view-card-margin: 0px
  state-icon-color: "#9da0a2"
  state-icon-active-color: "#3182b7"
  # `switch-*-color` and `paper-slider-*` were dropped by the frontend; these are the
  # current `ha-switch` / `ha-slider` equivalents.
  ha-switch-checked-background-color: "#7a7d7f"
  ha-switch-thumb-background-color: "#3b4041"
  ha-switch-background-color: "#0c0d0d"
  ha-slider-thumb-color: "#a4abb1"
  ha-slider-indicator-color: "#626a6f"
  ha-slider-track-color: "#202020"
  # `paper-toast-*` has no replacement, the toast is no longer themeable that way.
  # `vertical-stack-card-margin` is dead (the vertical stack moved from margins to a
  # grid `gap`), so it is dropped rather than translated to `-gap`: translating it
  # would newly activate `gap: 0` and squash the sidebar entries together.

  #temporarily revert 2022.12 icon colors
  state-active-color: "#3182b7"
  # `--rgb-state-default-color` is referenced by the state colors below but was
  # missing from this file, which made all of them invalid. 49, 130, 183 == #3182b7.
  rgb-state-default-color: 49, 130, 183
  state-alarm_control_panel-armed_away-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_custom_bypass-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_home-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_night-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_vacation-color: var(--rgb-state-default-color)
  state-alarm_control_panel-arming-color: var(--rgb-state-default-color)
  state-alarm_control_panel-disarming-color: var(--rgb-state-default-color)
  state-alarm_control_panel-pending-color: var(--rgb-state-default-color)
  state-alarm_control_panel-triggered-color: var(--rgb-state-default-color)
  state-alert-off-color: var(--rgb-state-default-color)
  state-alert-on-color: var(--state-active-color)
  state-binary_sensor-active-color: var(--state-active-color)
  state-binary_sensor-battery-on-color: var(--state-active-color)
  state-binary_sensor-carbon_monoxide-on-color: var(--state-active-color)
  state-binary_sensor-gas-on-color: var(--state-active-color)
  state-binary_sensor-heat-on-color: var(--state-active-color)
  state-binary_sensor-lock-on-color: var(--state-active-color)
  state-binary_sensor-moisture-on-color: var(--state-active-color)
  state-binary_sensor-problem-on-color: var(--state-active-color)
  state-binary_sensor-safety-on-color: var(--state-active-color)
  state-binary_sensor-smoke-on-color: var(--state-active-color)
  state-binary_sensor-sound-on-color: var(--state-active-color)
  state-binary_sensor-tamper-on-color: var(--state-active-color)
  state-climate-auto-color: var(--rgb-state-default-color)
  state-climate-cool-color: var(--rgb-state-default-color)
  state-climate-dry-color: var(--rgb-state-default-color)
  state-climate-fan_only-color: var(--rgb-state-default-color)
  state-climate-heat-color: var(--rgb-state-default-color)
  state-climate-heat-cool-color: var(--rgb-state-default-color)
  state-cover-active-color: var(--state-active-color)
  state-device_tracker-active-color: var(--state-active-color)
  state-device_tracker-home-color: var(--state-active-color)
  state-fan-active-color: var(--state-active-color)
  state-humidifier-active-color: var(--state-active-color)
  state-light-active-color: var(--state-active-color)
  state-lock-jammed-color: var(--rgb-state-default-color)
  state-lock-locked-color: var(--rgb-state-default-color)
  state-lock-pending-color: var(--rgb-state-default-color)
  state-lock-unlocked-color: var(--rgb-state-default-color)
  state-media_player-active-color: var(--state-active-color)
  state-person-active-color: var(--state-active-color)
  state-person-home-color: var(--state-active-color)
  state-plant-active-color: var(--state-active-color)
  state-siren-active-color: var(--state-active-color)
  state-sun-above_horizon-color: var(--rgb-state-default-color)
  state-sun-below_horizon-color: var(--rgb-state-default-color)
  state-switch-active-color: var(--state-active-color)
  state-update-active-color: var(--state-active-color)
  state-vacuum-active-color: var(--state-active-color)
  state-sensor-battery-high-color: var(--rgb-state-default-color)
  state-sensor-battery-low-color: var(--rgb-state-default-color)
  state-sensor-battery-medium-color: var(--rgb-state-default-color)

  #font
  primary-font-family: SF Pro Text, Roboto, system-ui
  # `paper-font-*_-_font-family` and `mdc-typography*-font-family` were replaced by
  # the `--ha-font-family-*` variables.
  ha-font-family-body: var(--primary-font-family)
  ha-font-family-code: var(--primary-font-family)
  ha-card-header-font-family: var(--primary-font-family)
  # Section titles. Every `type: grid` / stack card renders its title as
  # `h1.card-header` inside `hui-stack-card`'s shadow root, where the styles read
  # `var(--ha-card-header-font-size, var(--ha-font-size-2xl))` and
  # `var(--ha-card-header-color, ...)`, so these two theme keys restore the title
  # size the `card-mod-view-yaml` block it replaces used to set, without card-mod.
  # The original block also had portrait (3.3vw <= 1200px) and phone (5.5vw <= 800px)
  # variants; a theme key cannot carry a media query, so `max()` keeps the desktop
  # size exact instead of letting the titles collapse to ~10px on a phone - the
  # original breakpoints would need card-mod. Weight (original 500) and padding come
  # from `hui-stack-card` and are not variables, so they are left at the defaults.
  ha-card-header-font-size: max(2.4vw, 22px)
  ha-card-header-color: rgba(255, 255, 255, 0.8)

  #custom variables
  ha-card-background-color: rgba(34,38,39,0.9)
  ha-card-header-background-color: rgba(48,52,52,0.8)
  custom-layout-card-padding: 3.3vw

  sidebar-time-font-size: 5.2vw
  sidebar-time-line-height: 4.3vw
  sidebar-font-size: 1.42vw
  sidebar-line-height: 2vw
  bar-card-color: "#303435"

  #button_card_templates
  button-card-font-size: 1.35vw
  z-axis-adjustment: 0.05vw #tilt compensation
  button-card-font-weight: 500
  button-card-letter-spacing: -0.02vw
  button-card-border-radius: 10%

  footer-card-font-size: 1.22vw
  footer-card-icon-size: 1.5vw
  footer-card-padding-v: 0.7vw
  footer-card-padding-h: 1.1vw
  footer-card-border-radius: 0.65vw

  footer-notify-font-size: 0.9vw
  footer-notify-box-size: 1.8vw
  footer-notify-top: -0.9vw
  footer-notify-right: -1vw

  button-card-light-color-temp: hsl(204, 58%, 38%)

  #browser_mod.popup
  dialog-backdrop-filter: blur(2em) brightness(0.75)
  # Same thing under the variable the current dialog actually reads for the scrim, since
  # the one above is the legacy spelling (`--ha-dialog-scrim-backdrop-filter` wins over
  # `--dialog-backdrop-filter` when both are present).
  ha-dialog-scrim-backdrop-filter: blur(2em) brightness(0.75)
  popup-background-color: rgba(34,38,39,0.9)
  popup-border-radius: 1em
  popup-padding-x: 0px
  popup-padding-y: 0px
  # browser_mod builds the dialog width from `--popup-width`, which it declares itself as
  # `var(--popup-min-width, 580px)` on the dialog - so this key IS the width. The old
  # `440px` pinned every popup to 440px whatever it held (content squeezed, then scrolled
  # inside `--popup-max-height`); this one makes every non-fullscreen popup two thirds of
  # the screen, with a 600px floor for small screens and `min(..., 95vw)` so it never
  # leaves the viewport. `fullscreen` popups are untouched: browser_mod declares
  # `--popup-width: 100vw` (and `--popup-max-width: 100vw`) for that style itself, so the
  # cameras still fill the screen.
  #
  # Note this has to be a plain length. `min(max-content, 66vw)` would be the ideal
  # "content-sized, capped at two thirds", but CSS math functions take lengths, not the
  # `max-content` keyword, so that value would be invalid. `fit-content(66vw)` does mean
  # exactly that and is valid in a `width` - worth trying as
  # `popup-min-width: fit-content(min(max(66vw, 600px), 95vw))` - but it poisons the
  # `--width: min(...)` computation that browser_mod's own CSS does around it.
  popup-min-width: min(max(66vw, 600px), 95vw)
  popup-width-full: min(max(66vw, 600px), 95vw)
  popup-max-width: min(max(66vw, 600px), 95vw)
  # The dialog surface colour, as plain theme variables. `ha-dialog` reads
  # `--ha-dialog-surface-background`; the current frontend's dialog then passes that into
  # Web Awesome's `--wa-color-surface-raised`, which is what actually paints the panel -
  # set both, because which one wins differs between frontend builds and leaving the
  # surface unpainted is what made the popups see-through against the dashboard.
  ha-dialog-surface-background: var(--popup-background-color)
  wa-color-surface-raised: var(--popup-background-color)
  # `popup-border-width` was dropped: nothing reads it any more.
  tablet-popup-header-color: rgba(200, 218, 222, 0.05)
  tablet-popup-content-padding: 1.1em 2.2em 1.6em 1.5em
  tablet-popup-button-padding: 0.1em 2em 1.8em 2em
  tablet-popup-border-style: 1.5px solid rgba(0,0,0,0.2)
  # `tablet-popup-align-dialog`/`tablet-popup-margin-top` set `--vertical-align-dialog`
  # (gone) and a 0px top margin. The dialog is centred again below, which is what
  # `--vertical-align-dialog: center` did and what HA itself defaults to
  # (`margin-top: auto`); browser_mod's own default is 40px from the top.

####################################################
#                                                  #
#                     CARD-MOD                     #
#                                                  #
####################################################

  card-mod-theme: tablet
  # Debugging aid from README-themes.md: uncomment to have card-mod log what it does for a
  # type - and, with a class, for the cards/badges carrying that class. `more-info` is the
  # type browser_mod uses for untagged popups, so this is how to check whether the popup
  # styles in `card-mod-more-info` are being applied at all. Uncomment, reload, watch the
  # browser console, comment out again (it logs for every element).
  # card-mod-card-debug: true
  # card-mod-more-info-debug: true

  card-mod-root: |
    #view {
      background: url('/local/background.png');
      background-size: cover;
    }

  # `card-mod-view-yaml` lived here: the grid titles' typography, the sidebar's tint and
  # divider, the sidebar entries' portrait/phone sizes, the laundry timer's phone zoom,
  # the swipe-card margins and the footer's flex wrapping. None of it takes effect with
  # this frontend and card-mod 4.2.1 - verified in the rendered dashboard (the grid
  # titles' `h1` computes to HA's default 24px, not the 2.4vw the block asked for, and
  # there is no tint or divider at the sidebar's edge) - so it is removed rather than
  # kept as decoration. Where the pieces that mattered live now:
  #   section titles       -> the `ha-card-header-font-size` / `-color` keys above
  #   sidebar tint/divider -> `card_mod` on the sidebar vertical-stack
  #                           (ui-lovelace-tablet.yaml)
  #   sidebar entry sizing -> button_card_templates/sidebar.yaml (`extra_styles`)
  #   footer distribution  -> `card_mod` on the footer stack (ui-lovelace-tablet.yaml)
  #   swipe-card clipping  -> the `square: false` + `grid-card-gap` fix, commented in
  #                           ui-lovelace-tablet.yaml
  # Not carried over: the laundry timer's phone zoom (card-mod 4 skips `conditional`
  # cards) and the sidebar `#name` breakpoints (they sized with
  # `--markdown-sidebar-font-size`, which this theme never defines).

  # Classes are set on the card *element* in card-mod v4, which is `:host` for the styles
  # card-mod applies in that element's shadow root (see README-application.md:
  # `hui-card → <card> (:host, class set here) → shadowRoot (card-mod applies here)`).
  # So a bare `.header ...` never matches - the class is on the host, not on a descendant.
  # The dual selector covers both shapes: `:host(.x)` for cards Home Assistant loads, and
  # `ha-card.x` for cards loaded by a custom card, where v4 also sets the class on
  # `ha-card` itself (the docs' recommended pattern).
  card-mod-card: |
    :host(.header) .card-header,
    ha-card.header .card-header {
      letter-spacing: 0.005em;
      font-size: 1.6em;
      font-weight: 400;
      padding: 0.8em 0 0 1.3em;
      line-height: initial;
      cursor: default;
    }

    :host(.content) .card-content,
    ha-card.content .card-content {
      padding: var(--tablet-popup-content-padding);
    }

    /* * * * * * * * * * * * * * * * * *
      *                                 *
      *         CUSTOM BAR CARD         *
      *                                 *
      * * * * * * * * * * * * * * * * * */

    :host(.type-custom-bar-card) bar-card-name,
    ha-card.type-custom-bar-card bar-card-name {
      padding-left: 0.25em;
      letter-spacing: normal;
    }

    :host(.type-custom-bar-card) bar-card-iconbar,
    ha-card.type-custom-bar-card bar-card-iconbar {
      padding-left: 0.23em;
    }

    :host(.type-custom-bar-card) bar-card-value,
    ha-card.type-custom-bar-card bar-card-value {
      font-size: 0.9em;
      font-weight: 400;
      color: #e0e1e1;
      letter-spacing: 0.01em;
      text-shadow: none;
      margin-right: auto;
    }

    :host(.type-custom-bar-card) bar-card-backgroundbar,
    ha-card.type-custom-bar-card bar-card-backgroundbar {
      background: none;
    }

    :host(.type-custom-bar-card) bar-card-background,
    ha-card.type-custom-bar-card bar-card-background {
      background: radial-gradient(circle, rgba(52, 57, 58, 0.1) 0%, rgba(17, 18, 18, 0.2) 75%);
      box-shadow: inset 0 0 25px #00000045;
      border-radius: 0.3em;
      overflow: hidden;
    }

  # browser_mod calls card-mod with the type `more-info` for untagged popups, so this is
  # where a popup's own dialog chrome is styled. It has to be the plain (string) form:
  # the `card-mod-more-info-yaml` selector-tree form does not take effect on this
  # frontend at all. Inspecting an open popup shows its card-mod element with
  # `_fixed_styles` empty and nothing rendered, i.e. card-mod's YAML->JSON conversion of
  # the theme block never completes, so neither the rules in it nor the `$` paths are ever
  # applied - which is also why the old `card-mod-view-yaml` block was inert.
  #
  # This CSS lands in the popup element's own shadow root, next to `<ha-dialog>` and
  # browser_mod's slotted `.title`, which is as far as plain CSS reaches. The dialog
  # header and the surface panel are inside the dialog's shadow root, so the theme's
  # header tint and divider would need a working `-yaml` route (or Uix) to come back.
  card-mod-more-info: |
    :host {
      --ha-card-border-width: 0;
    }

    /* Vertical placement is left to browser_mod (40px from the top on a normal popup).
       Do not centre it with `--dialog-surface-margin-top: auto`: a popup taller than the
       viewport then gets pushed up, taking the header - and with it the close button -
       off the top of the screen. Use `0px` here instead to pin popups flush to the top. */
    ha-dialog {
      --ha-dialog-border-radius: var(--popup-border-radius);
    }

    .title {
      font-family: var(--primary-font-family);
    }
