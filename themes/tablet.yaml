tablet:
  #enable mode
  modes: { dark: { .: . } }

  #edited default dark mode
  ha-card-box-shadow: none
  ha-card-background: none
  # Native cards in popups were showing their default full border after the Uix
  # `--ha-card-border-width: 0` rule was removed. These two keys are the native
  # theme variables HA cards read, so popup columns render borderless again.
  ha-card-border-width: 0px
  ha-card-border-radius: 0px

  # HA's `hui-grid-card` does `#root { grid-gap: var(--grid-card-gap, 8px) }`. A
  # PERCENTAGE row-gap resolves to 0 during intrinsic sizing and is only applied in
  # the final layout, so a grid reports a content height ~5% smaller than what it
  # actually lays out to. The layout sizes its row from that smaller number and the
  # swipe-card (pinned to 100% of the cell) clips the difference. A length is
  # accounted for correctly; 1vw is ~5% of a cell in this layout, so the spacing is
  # unchanged (measured: 5% of a 319px grid = 15.95px, 1vw at 1614px = 16.14px).
  grid-card-gap: 1vw
  masonry-view-card-margin: 0px
  state-icon-color: "#9da0a2"
  state-icon-active-color: "#3182b7"
  # `switch-*-color` and `paper-slider-*` were dropped by the frontend; these are the
  # current `ha-switch` / `ha-slider` equivalents.
  ha-switch-checked-background-color: "#7a7d7f"
  ha-switch-thumb-background-color: "#3b4041"
  ha-switch-background-color: "#0c0d0d"
  ha-slider-thumb-color: "#a4abb1"
  ha-slider-indicator-color: "#626a6f"
  ha-slider-track-color: "#202020"
  # `paper-toast-*` has no replacement, the toast is no longer themeable that way.
  # `vertical-stack-card-margin` is dead (the vertical stack moved from margins to a
  # grid `gap`), so it is dropped rather than translated to `-gap`: translating it
  # would newly activate `gap: 0` and squash the sidebar entries together.

  #temporarily revert 2022.12 icon colors
  state-active-color: "#3182b7"
  # `--rgb-state-default-color` is referenced by the state colors below but was
  # missing from this file, which made all of them invalid. 49, 130, 183 == #3182b7.
  rgb-state-default-color: 49, 130, 183
  state-alarm_control_panel-armed_away-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_custom_bypass-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_home-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_night-color: var(--rgb-state-default-color)
  state-alarm_control_panel-armed_vacation-color: var(--rgb-state-default-color)
  state-alarm_control_panel-arming-color: var(--rgb-state-default-color)
  state-alarm_control_panel-disarming-color: var(--rgb-state-default-color)
  state-alarm_control_panel-pending-color: var(--rgb-state-default-color)
  state-alarm_control_panel-triggered-color: var(--rgb-state-default-color)
  state-alert-off-color: var(--rgb-state-default-color)
  state-alert-on-color: var(--state-active-color)
  state-binary_sensor-active-color: var(--state-active-color)
  state-binary_sensor-battery-on-color: var(--state-active-color)
  state-binary_sensor-carbon_monoxide-on-color: var(--state-active-color)
  state-binary_sensor-gas-on-color: var(--state-active-color)
  state-binary_sensor-heat-on-color: var(--state-active-color)
  state-binary_sensor-lock-on-color: var(--state-active-color)
  state-binary_sensor-moisture-on-color: var(--state-active-color)
  state-binary_sensor-problem-on-color: var(--state-active-color)
  state-binary_sensor-safety-on-color: var(--state-active-color)
  state-binary_sensor-smoke-on-color: var(--state-active-color)
  state-binary_sensor-sound-on-color: var(--state-active-color)
  state-binary_sensor-tamper-on-color: var(--state-active-color)
  state-climate-auto-color: var(--rgb-state-default-color)
  state-climate-cool-color: var(--rgb-state-default-color)
  state-climate-dry-color: var(--rgb-state-default-color)
  state-climate-fan_only-color: var(--rgb-state-default-color)
  state-climate-heat-color: var(--rgb-state-default-color)
  state-climate-heat-cool-color: var(--rgb-state-default-color)
  state-cover-active-color: var(--state-active-color)
  state-device_tracker-active-color: var(--state-active-color)
  state-device_tracker-home-color: var(--state-active-color)
  state-fan-active-color: var(--state-active-color)
  state-humidifier-active-color: var(--state-active-color)
  state-light-active-color: var(--state-active-color)
  state-lock-jammed-color: var(--rgb-state-default-color)
  state-lock-locked-color: var(--rgb-state-default-color)
  state-lock-pending-color: var(--rgb-state-default-color)
  state-lock-unlocked-color: var(--rgb-state-default-color)
  state-media_player-active-color: var(--state-active-color)
  state-person-active-color: var(--state-active-color)
  state-person-home-color: var(--state-active-color)
  state-plant-active-color: var(--state-active-color)
  state-siren-active-color: var(--state-active-color)
