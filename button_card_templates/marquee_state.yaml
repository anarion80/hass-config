marquee_state:
  template:
    - base
    #- base_media
  state_display: >
    [[[
      if (entity) {
        let elt = this.shadowRoot,
          await = setTimeout(marquee, 0),
          output = entity.state;
        function marquee() {
          let state = elt.getElementById("state"),
            container = elt.getElementById("container");
          if (state && container) {
            state.innerHTML = output;
            let ro = new ResizeObserver(entries => {
              let spacer = "&nbsp;".repeat(3),
                s = entries[0],
                c = entries[1],
                r = s && s.contentRect &&
                    c && c.contentRect &&
                    s.contentRect.width !== 0 &&
                    c.contentRect.width !== 0;
              if (r && s.contentRect.width < c.contentRect.width) {
                state.classList.remove("marquee");
              }
              else if (r && s.contentRect.width >= c.contentRect.width) {
                state.innerHTML = `${output} ${spacer} ${output} ${spacer}&nbsp;`;
                state.classList.add("marquee");
              }
            });
            ro.observe(state);
            ro.observe(container);
          }
        }
        return output;
      }
      return variables.translate_unknown;
    ]]]
  # The state_display above toggles the `marquee` class on `#state`, but the
  # animation itself was only defined inside the `conditional_media` / `basic`
  # templates' extra_styles. Without it the class did nothing and a long state
  # stayed clipped by the `.ellipsis` rule, so ship the keyframes here too and
  # make this template self-contained.
  extra_styles: |
    #container {
      overflow: hidden;
    }
    .marquee {
      animation: marquee 20s linear infinite;
    }
    @keyframes marquee {
      from {
        transform: translateX(0%);
      }
      to {
        transform: translateX(-50%);
      }
    }
  styles:
    state:
      - z-index: 3
      - max-width: unset
      - overflow: visible
      - margin-bottom: -0.5%
