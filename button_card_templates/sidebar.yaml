sidebar:
  show_state: false
  show_icon: false
  tap_action:
    action: none
  name: |
    [[[
      if (entity) {
        let attr = [];
        for (let [k, value] of Object.entries(entity.attributes))
          window.navigator.userAgent.match(/iPhone/i)
            ? k !== 'time' && k !== 'date' && value !== false && (attr += `<p>${k === 'greet' ? `<span class="iphone">${value}</span>` : `${value}`}</p>`)
            : value !== false && (attr += `<p>${value}</p>`);
        return attr;
      }
    ]]]
  extra_styles: |
    #card {
      padding: 0;
      border-width: 0;
      font-family: SF Pro Display, Roboto, system-ui;
    }
    #container {
      display: flex !important;
    }
    #name {
      /* This lives in the template's own extra_styles, which is injected straight into
         this card's shadow root, where #name lives - so it cannot be knocked out by a
         selector change or by HA wrapping stack children in <hui-card>.

         - 2vw on both sides, equal.
         - `0.25vw` top and bottom (~48px text-to-text).
         - The clock gets extra top space from its own card in ui-lovelace-tablet.yaml
           (a `styles.card` padding), because it is the only entry that needs it and a
           template rule cannot single it out without `:has()`. */
      padding: 0.25vw 2vw;
      white-space: normal;
      text-align: left;
      font-family: SF Pro Display, Roboto, system-ui;
      font-size: var(--sidebar-font-size);
      line-height: var(--sidebar-line-height);
      font-weight: 200;
      letter-spacing: 0.06vw;
      color: #6a7377;
    }
    #name > b {
        color: rgba(255, 255, 255, 0.8);
    }
    .iphone {
      font-size: 1.5em;
      color: rgba(255, 255, 255, 0.8);
    }
    /* There is deliberately no `#name p:has(.time)` rule here: the clock's markup is a
       bare `<span class="time">` (see sidebar.yaml's `time` attribute) and the only
       `<p>` elements are added by this template's name-builder, which the sidebar
       cards bypass by passing `name:` explicitly. Such a rule never matches, which is
       why it silently did nothing. The clock's top offset lives on its own card in
       ui-lovelace-tablet.yaml instead. */
    .time {
      font-size: var(--sidebar-time-font-size);
      font-weight: 300;
      line-height: var(--sidebar-time-line-height);
      letter-spacing: 0.11vw;
      margin-left: -0.3vw;
      color: rgba(255, 255, 255, 0.8);
    }
    .time-colon {
      position: relative;
      top: -.09em;
    }
    p {
      font-size: var(--sidebar-font-size);
      line-height: var(--sidebar-line-height);
      font-weight: 200;
      letter-spacing: 0.07vw;
      color: #6a7377;
    }
    b {
      font-weight: 700;
    }
    /* portrait */
    @media screen and (max-width: 1200px) {
      .time {
        font-size: calc(var(--sidebar-time-font-size) * 1.4 );
        line-height: calc(var(--sidebar-time-line-height) * 1.4 );
      }
      p {
        font-size: calc(var(--sidebar-font-size) * 1.4 );
        line-height: calc(var(--sidebar-line-height) * 1.4 );
      }
    }
    /* phone */
    @media screen and (max-width: 800px) {
      .time {
        font-size: calc(var(--sidebar-time-font-size) * 2.6 );
      }
      p {
        font-size: calc(var(--sidebar-font-size) * 2.6 );
        line-height: calc(var(--sidebar-line-height) * 2.6 );
        letter-spacing: 0.16vw;
      }
      #name {
        padding: 0 0 0 1vw;
      }
    }