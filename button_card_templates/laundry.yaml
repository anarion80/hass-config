laundry:
  template:
    - settings
  show_icon: false
  show_name: false
  show_state: true
  state_display: >
    [[[
      if (entity.state === 'idle') {
        return variables.translate_idle;
      }
    ]]]
  # `restart` / `cancel` were js templates inside `*_action` (deep evaluated on tap up
  # to button-card 4.3.0). `action: javascript` is the supported replacement since 5.0.
  tap_action:
    action: javascript
    javascript: >
      [[[
        hass.callService('timer', 'cancel', {
            entity_id: entity.entity_id
        });
        hass.callService('timer', 'start', {
            entity_id: entity.entity_id
        });
      ]]]
  hold_action:
    action: javascript
    javascript: >
      [[[
        hass.callService('timer', 'cancel', {
            entity_id: entity.entity_id
        });
      ]]]
  styles:
    card:
      - background: '#202a2f30'
      - border-radius: 0.7vw
      - border: '0.2vw solid #292c2e'
    state:
      - font-size: 2.7vw
      - font-family: SF Mono, Roboto
      - opacity: 0.65
      - padding: 0.55vw 1.2vw 0.5vw 1.2vw
