base:
  template:
    - settings
    - tilt
    - extra_styles
  variables:
    state_on: >
      [[[ return ['wł.','on', 'home', 'cool', 'fan_only', 'playing', 'Normalny', 'Intensywny', 'Poza Domem', 'Turbo', 'unlocked'].indexOf(entity === undefined || entity.state) !== -1; ]]]
    state: >
      [[[ return !entity || entity.state; ]]]
    entity_id: >
      [[[ return !entity || entity.entity_id; ]]]
    entity_picture: >
      [[[ return !entity || entity.attributes.entity_picture; ]]]
    timeout: >
      [[[ return !entity || Date.now() - Date.parse(entity.last_changed); ]]]
    # button-card >= 7 discovers the entities used in js templates automatically,
    # so the old `triggers_update: sensor.youtube_watching` is neither needed nor
    # read anymore. Keep the sensor in a variable so it stays discoverable.
    youtube_watching_sensor: sensor.youtube_watching
    is_youtube: >
      [[[
        let is_youtube = entity?.attributes?.app_id === 'com.google.android.youtube',
            media_title = entity?.attributes?.media_title,
            watching_title = states[variables.youtube_watching_sensor]?.attributes?.title;
        if (is_youtube && media_title === watching_title) {
            return true;
        }
      ]]]
  aspect_ratio: 1/1
  show_state: true
  show_icon: false
  # state_display: >
  #   [[[ if (variables.state === true) return variables.translate_unknown; ]]]
  state_display: >
    [[[
      const stateDict = {
        'on': variables.translate_on,
        'off': variables.translate_off,
        'cool': variables.translate_cool,
        'fan_only': variables.translate_fan_only,
      };
      if (variables.state === true) return variables.translate_unknown;
      return stateDict[variables.state];
    ]]]
  # Up to button-card 4.3.0 the whole `*_action` object was deep evaluated on every
  # tap, which is how the extra js templates below used to run. 5.0 removed that and
  # now only reads the documented action options, so they are expressed with the
  # supported actions instead.
  tap_action:
    action: multi-actions
    haptic: medium
    # `sound` is a first class action option (since 5.0) and, contrary to `action`,
    # it is merged into the cards that override the tap action (popups, ...), so the
    # tablet tap audio feedback keeps working everywhere.
    sound: >
      [[[
        let screensaver = states[variables.entity_tablet] === undefined ||
            states[variables.entity_tablet].state;

        if (screensaver !== 'off') {
            return;
        }
        if (variables.state === 'off') {
            return '/local/sound/on.m4a';
        }
        if (variables.state_on) {
            return '/local/sound/off.m4a';
        }
      ]]]
    actions:
      # visual tap feedback (was the `card_bounce` js hack)
      - action: javascript
        javascript: |
          [[[
            // add animation
            if (this.getElementsByTagName("style").length === 0) {
                // phone condition
                let mq = window.matchMedia('(max-width: 800px)').matches;
                let style = document.createElement('style');
                style.innerHTML = `
                    @keyframes card_bounce {
                        0%   { transform: scale(1); }
                        10%  { transform: scale(${ mq ? '0.92' : '0.94' }); }
                        25%  { transform: scale(1); }
                        30%  { transform: scale(${ mq ? '0.96' : '0.98' }); }
                        100% { transform: scale(1); }
                    }
                `;
                this.appendChild(style);
            }
            // duration
            let duration = 800;
            // animate
            this.style.animation = `card_bounce ${duration}ms cubic-bezier(0.22, 1, 0.36, 1)`;
            // reset
            window.setTimeout(() => { this.style.animation = "none"; }, duration + 100)
          ]]]
      - action: toggle
  # `action: block` was never a documented action: it only worked because an unknown
  # action still makes button-card count the card as having a hold/double-tap action,
  # which is what swallows the gesture instead of falling through to the tap action.
  # An (empty) javascript action expresses the same thing with supported config.
  double_tap_action:
    action: javascript
    javascript: '[[[ ]]]'
    haptic: success
  hold_action:
    action: javascript
    javascript: '[[[ ]]]'
  styles:
    grid:
      - grid-template-areas: |
          "icon  circle"
          "n     n"
          "s     s"
      - grid-template-columns: repeat(2, 1fr)
      - grid-template-rows: auto repeat(2, min-content)
      - gap: 1.3%
      - align-items: start
      - will-change: transform
    name:
      - justify-self: start
      - line-height: 121%
    state:
      - justify-self: start
      - line-height: 115%
    card:
      - border-radius: var(--button-card-border-radius)
      - border-width: 0
      - -webkit-tap-highlight-color: rgba(0,0,0,0)
      - transition: none
      # `--mdc-ripple-color` was replaced by `--button-card-ripple-color` in 5.0
      - --button-card-ripple-color: >
          [[[
            return variables.state_on
                ? 'rgb(0, 0, 0)'
                : '#97989c';
          ]]]
      - color: >
          [[[
            return variables.state_on
                ? '#4b5254'
                : '#97989c';
          ]]]
      - background-color: >
          [[[
            return variables.state_on
                ? 'rgba(255, 255, 255, 0.85)'
                : 'rgba(115, 115, 115, 0.25)';
          ]]]
