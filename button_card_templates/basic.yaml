basic:
  template:
    - settings
  variables:
    state_on: >
      [[[ return ['wł.','on', 'home', 'cool', 'fan_only', 'playing', 'Normalny', 'Intensywny', 'Poza Domem', 'Turbo'].indexOf(entity === undefined || entity.state) !== -1; ]]]
    state: >
      [[[ return entity === undefined || entity.state; ]]]
    entity_id: >
      [[[ return entity === undefined || entity.entity_id; ]]]
    media_on: >
      [[[ return entity === undefined || ['playing', 'paused'].indexOf(entity.state) !== -1; ]]]
    media_off: >
      [[[ return entity === undefined || ['off', 'idle', 'standby', 'unknown', 'unavailable'].indexOf(entity.state) !== -1; ]]]
    entity_picture: >
      [[[ return entity === undefined || entity.attributes.entity_picture; ]]]
    timeout: >
      [[[ return entity === undefined || Date.now() - Date.parse(entity.last_changed); ]]]
  aspect_ratio: 1/1
  show_state: false
  show_icon: true
  state_display: >
    [[[ if (variables.state === true) return variables.translate_unknown; ]]]
  # `ui_sound_tablet` / `animation_card` were js templates inside `tap_action` (deep
  # evaluated on tap up to button-card 4.3.0). They are now... the `sound` option and a
  # `javascript` step of a `multi-actions` action.
  tap_action:
    action: multi-actions
    haptic: medium
    sound: >
      [[[
        let screensaver = states[variables.entity_tablet] === undefined ||
          states[variables.entity_tablet].state;

        if (variables.state === 'off' && screensaver === 'on') {
          return '/local/sound/on.m4a';
        }
        if (variables.state_on && screensaver === 'off') {
          return '/local/sound/off.m4a';
        }
      ]]]
    actions:
      - action: javascript
        javascript: |
          [[[
            let time = 900;
            this.shadowRoot.getElementById('card').style.animation =
              `card_bounce ${time}ms cubic-bezier(0.22, 1, 0.36, 1)`,
              window.setTimeout(() => {
                this.shadowRoot.getElementById('card').style.animation = 'none'
              }, time);
          ]]]
      - action: toggle
  # `haptic` alone is not a valid action anymore (5.0 validates the action config), an
  # (empty) javascript action is what keeps the long-press swallowed.
  hold_action:
    action: javascript
    javascript: '[[[ ]]]'
    haptic: success

  styles:
    icon:
      - width: 100%
      - color: var(--state-icon-color)
    card:
      - border-radius: var(--button-card-border-radius)
      - -webkit-tap-highlight-color: rgba(0,0,0,0)
      - transition: none
      - padding: 10% 9% 9% 10%
      - --button-card-ripple-color: >
          [[[
            return variables.state_on
              ? 'rgb(0, 0, 0)'
              : 'rgba(255, 255, 255, 0.3)';
          ]]]
      - color: >
          [[[
            return variables.state_on
              ? 'rgba(0, 0, 0, 0.6)'
              : 'rgba(255, 255, 255, 0.3)';
          ]]]
      - background-color: >
          [[[
            return variables.state_on
              ? 'rgba(255, 255, 255, 0.8)'
              : 'rgba(115, 115, 115, 0.2)';
          ]]]
  extra_styles: |
    [[[
      if (entity) {
        let hs = entity.attributes.hs_color === undefined,
          h = hs || entity.attributes.hs_color[0],
          s = hs || entity.attributes.hs_color[1],
          l_min = 28,
          l_max = 48,
          l_calc = entity.attributes.brightness / 2.54 * (l_max - l_min) / 100 + l_min;
        var light_color = entity.attributes.color_mode === 'color_temp' || entity.attributes.color_mode === 'brightness'
          ? `hsl(204, 58%, ${l_calc}%);`
          : `hsl(${h}, ${s}%, ${l_calc}%);`;
      }
      return `
        svg {
          --light-color:
          ${ variables.state_on && entity.attributes.brightness !== undefined
              ? light_color
              : variables.state_on && entity.attributes.brightness === undefined
                ? 'var(--state-icon-active-color);'
                : 'var(--state-icon-color);'
          }
        }
        #container {
          text-align: left !important;
        }
        #name, #state {
          letter-spacing: -0.02vw;
        }
        #name::first-letter {
          text-transform: uppercase;
        }
        /* portrait */
        @media screen and (max-width: 1200px) {
          #name, #state {
            letter-spacing: 0.05vw;
          }
        }
        /* phone */
        @media screen and (max-width: 800px) {
          #name, #state {
            letter-spacing: 0.12vw;
          }
        }
        @keyframes card_bounce {
          0% {
            transform: scale(1);
          }
          15% {
            transform: scale(0.9);
          }
          25% {
            transform: scale(1);
          }
          30% {
            transform: scale(0.98);
          }
          100% {
            transform: scale(1);
          }
        }
        .marquee {
          animation: marquee 20s linear infinite;
        }
        @keyframes marquee {
          from {
            transform: translateX(0);
          }
          to {
            transform: translateX(-50%);
          }
        }
      `
    ]]]