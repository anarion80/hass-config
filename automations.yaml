- id: '1730722012692'
  alias: Termostat się przestawił
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - climate.wejscie
    - climate.gabinet
    - climate.salon
    - climate.sypialnia
    - climate.hania
    - climate.wojtek
    - climate.lazienka
    - climate.lazienka_dol
    - climate.piwnica
    - climate.kotlownia
    - climate.wodomierz
    - climate.schowek
    - climate.garaz
    attribute: temperature
    above: 25
  conditions: []
  actions:
  - action: notify.send_message
    metadata: {}
    target:
      entity_id: notify.anarion_iwona_phones
    data:
      message: Czujnik temperatury {{ trigger.entity_id }} się przestawił
      title: Czujnik temperatury się przestawił
  mode: single
