- id: '1789645584151'
  alias: fullykiosk_close_popups_disable_screen
  description: Close popups when screensaver is enabled
  triggers:
  - trigger: state
    entity_id:
    - switch.salon_samsung_tablet_wygaszacz_ekranu
    to:
    - 'on'
  conditions: []
  actions:
  - action: browser_mod.close_popup
  mode: restart
- id: '1789645595571'
  alias: fullykiosk_enable_screen_brightness
  description: Set brightness when screen enabled
  triggers:
  - trigger: state
    entity_id:
    - switch.salon_samsung_tablet_wygaszacz_ekranu
    from:
    - 'on'
    to:
    - 'off'
  conditions: []
  actions:
  - action: number.set_value
    target:
      entity_id: number.salon_samsung_tablet_jasnosc_wygaszacza_ekranu
    data:
      value: '{% set day_percent = 90 %} {% set night_percent = 65 %} {% set day_convert
        = ((day_percent * 255) / 100) | int %} {% set night_convert = ((night_percent
        * 255) / 100) | int %} {{ iif(is_state(''sun.sun'', ''above_horizon''), day_convert,
        night_convert) }}

        '
  mode: restart
