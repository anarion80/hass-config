action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Odkurzanie
    timeout: 300000
    style: |
      --primary-color: transparent; /* hide timeout progress */
    content:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        margin: 0
        grid-template-columns: 385px 595px
        grid-template-rows: 1fr
        grid-template-areas: |
          "info map"
        mediaquery:
          #phone
          "(max-width: 800px)":
            grid-template-columns: 1fr
            grid-template-rows: repeat(2, 1fr)
            grid-template-areas: |
              "info"
              "map"
      cards:
        - type: vertical-stack
          view_layout:
            grid-area: info
          cards:
            - type: entities
              # title: Ogólne
              entities:
                - type: custom:more-info-card
                  entity: vacuum.valetudo_dreame1
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: vacuum.valetudo_dreame1
                  icon: mdi:play-pause
                  tap_action:
                    action: perform-action
                    perform_action: >
                      [[[
                        return `[[[
                          return entity.state === 'docked' || entity.state === 'paused'
                            ? 'vacuum.start'
                            : 'vacuum.pause';
                        ]]]`
                      ]]]
                    data:
                      entity_id: vacuum.valetudo_dreame1
                  template: icon_only

                - type: custom:button-card
                  entity: vacuum.valetudo_dreame1
                  icon: mdi:battery-charging
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.return_to_base
                    data:
                      entity_id: vacuum.valetudo_dreame1
                  template: icon_only

                - type: custom:button-card
                  entity: vacuum.valetudo_dreame1
                  icon: mdi:robot-vacuum
                  tap_action:
                    action: perform-action
                    perform_action: script.vacuum_clean_segments
                    # service: script.vacuum_clean_segments_message
                    # service_data:
                    #   segments: '{{expand("group.vacuum_rooms") | selectattr("state","eq","on") | map(attribute="attributes.room_id") | list | to_json}}'
                    target: {}
                  template: icon_only

        - type: custom:xiaomi-vacuum-map-card
          language: pl
          entity: vacuum.valetudo_dreame1
          vacuum_platform: Hypfer/Valetudo
          map_source:
            camera: camera.dreame1_camera_camera
          calibration_source:
            camera: true
          map_locked: true
          internal_variables:
            topic: valetudo/dreame1
          map_modes:
            - name: Pokoje
              icon: mdi:floor-plan
              run_immediately: false
              coordinates_rounding: true
              coordinates_to_meters_divider: 1000
              selection_type: ROOM
              max_selections: 999
              repeats_type: EXTERNAL
              max_repeats: 3
              service_call_schema:
                service: mqtt.publish
                service_data:
                  topic: '[[topic]]/MapSegmentationCapability/clean/set'
                  payload: >-
                    {"segment_ids": [[selection]], "iterations": [[repeats]],
                    "customOrder": true}
              predefined_selections:
                - id: '1'
                  icon:
                    name: mdi:broom
                    x: 3202
                    'y': 2915
                  label:
                    text: Parter
                    x: 3202
                    'y': 2915
                    offset_y: 35
                  outline:
                    - - 3055
                      - 2970
                    - - 3200
                      - 2735
                    - - 3300
                      - 2735
