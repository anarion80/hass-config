                - id: '3'
                  icon:
                    name: mdi:broom
                    x: 2820
                    'y': 3295
                  label:
                    text: Jadalnia
                    x: 2820
                    'y': 3295
                    offset_y: 35
                  outline:
                    - - 3045
                      - 3195
                    - - 2940
                      - 3595
                    - - 2895
                      - 3620
                    - - 2685
                      - 3620
                    - - 2630
                      - 3590
                    - - 2625
                      - 3580
                    - - 2610
                      - 3525
