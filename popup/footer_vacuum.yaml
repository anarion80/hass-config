              variables:
                p: valetudo/dreame1
            - name: Sprzątanie strefowe
              icon: mdi:select-drag
              run_immediately: false
              coordinates_rounding: true
              coordinates_to_meters_divider: 100
              selection_type: MANUAL_RECTANGLE
              max_selections: 5
              repeats_type: EXTERNAL
              max_repeats: 3
              service_call_schema:
                service: mqtt.publish
                evaluate_data_as_template: true
                service_data:
                  topic: '[[topic]]/ZoneCleaningCapability/start/set'
                  payload: >-
                    {"zones": [{%for s in ('[[selection]]')|from_json %}{
                    "points": {"pA": { "x": {{s[0]}}, "y": {{s[1]}} }, "pB": {
                    "x": {{s[2]}}, "y": {{s[1]}} }, "pC": { "x": {{s[2]}}, "y":
                    {{s[3]}} }, "pD": { "x": {{s[0]}}, "y": {{s[3]}} } } }{%if
                    not loop.last%},{%endif%}{%endfor%}], "iterations":
                    [[repeats]]}
              predefined_selections: []
              variables: {}
            - name: Zapisane strefy
              icon: mdi:floor-plan
              run_immediately: false
              coordinates_rounding: true
              coordinates_to_meters_divider: 1000
              selection_type: PREDEFINED_RECTANGLE
              max_selections: 999
              repeats_type: EXTERNAL
              max_repeats: 3
              service_call_schema:
                service: mqtt.publish
                evaluate_data_as_template: true
                service_data:
                  topic: '[[topic]]/ZoneCleaningCapability/start/set'
                  payload: >-
                    {"zones": [{%for s in ('[[selection]]')|from_json %}{
                    "points": {"pA": { "x": {{s[0]}}, "y": {{s[1]}} }, "pB": {
                    "x": {{s[2]}}, "y": {{s[1]}} }, "pC": { "x": {{s[2]}}, "y":
                    {{s[3]}} }, "pD": { "x": {{s[0]}}, "y": {{s[3]}} } } }{%if
                    not loop.last%},{%endif%}{%endfor%}], "iterations":
                    [[repeats]]}
              predefined_selections:
                - id: '5'
                  zones:
                    - - 26668
                      - 25729
                      - 27183
                      - 26327
                  label:
                    text: Stół
                    x: 26950
                    'y': 26000
                    offset_y: 35
                  icon:
                    name: mdi:table-furniture
                    x: 26950
                    'y': 26000
                - id: '6'
                  zones:
                    - - 26280
                      - 25965
                      - 26481
                      - 26154
                  label:
                    text: Test
                    x: 26300
                    'y': 25900
                    offset_y: 35
                  icon:
                    name: mdi:table-furniture
                    x: 26300
                    'y': 25900
              variables: {}
            - name: Idź do punktu
              icon: mdi:map-marker-plus
              run_immediately: false
              coordinates_rounding: true
              coordinates_to_meters_divider: 100
              selection_type: MANUAL_POINT
              max_selections: 999
              repeats_type: NONE
              max_repeats: 1
              service_call_schema:
                service: mqtt.publish
                service_data:
                  topic: '[[topic]]/GoToLocationCapability/go/set'
                  payload: '{ "coordinates": { "x": [[point_x]], "y": [[point_y]] } }'
              predefined_selections: []
              variables: {}
          two_finger_pan: false
          icons:
            - icon_id: start_cleanup
              icon: mdi:play
              conditions:
                - entity: vacuum.valetudo_dreame1
                  value_not: cleaning
                - entity: vacuum.valetudo_dreame1
                  value_not: error
                - entity: vacuum.valetudo_dreame1
                  value_not: returning
              tooltip: Uruchom
              tap_action:
                action: call-service
                service: vacuum.start
                service_data:
                  entity_id: vacuum.valetudo_dreame1
            - icon_id: pause
              icon: mdi:pause
              conditions:
                - entity: vacuum.valetudo_dreame1
                  value_not: docked
                - entity: vacuum.valetudo_dreame1
                  value_not: idle
                - entity: vacuum.valetudo_dreame1
                  value_not: error
                - entity: vacuum.valetudo_dreame1
                  value_not: paused
              tooltip: Wstrzymaj
              tap_action:
                action: call-service
                service: vacuum.pause
                service_data:
                  entity_id: vacuum.valetudo_dreame1
            - icon_id: stop
              icon: mdi:stop
              conditions:
                - entity: vacuum.valetudo_dreame1
                  value_not: docked
                - entity: vacuum.valetudo_dreame1
                  value_not: idle
                - entity: vacuum.valetudo_dreame1
                  value_not: error
                - entity: vacuum.valetudo_dreame1
                  value_not: paused
              tooltip: Zatrzymaj
              tap_action:
                action: call-service
                service: vacuum.stop
                service_data:
                  entity_id: vacuum.valetudo_dreame1
            - icon_id: return_to_base
              icon: mdi:home-map-marker
              conditions:
                - entity: vacuum.valetudo_dreame1
                  value_not: docked
                - entity: vacuum.valetudo_dreame1
                  value_not: returning
              tooltip: Wróć do stacji dokującej
              tap_action:
                action: call-service
                service: vacuum.return_to_base
                service_data:
                  entity_id: vacuum.valetudo_dreame1
            - icon_id: locate
              icon: mdi:map-marker
              tooltip: Zlokalizuj
              tap_action:
                action: call-service
                service: vacuum.locate
                service_data:
                  entity_id: vacuum.valetudo_dreame1
            - icon_id: fan_speed_menu_low
              menu_id: fan_speed
              icon: mdi:fan-alert
              label: low
              conditions:
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value: low
              tooltip: Zmień prędkość wentylatora
              tap_action:
                action: call-service
                service: vacuum.set_fan_speed
                service_data:
                  entity_id: vacuum.valetudo_dreame1
                  fan_speed: low
            - icon_id: fan_speed_menu_medium
              menu_id: fan_speed
              icon: mdi:fan-alert
              label: Średni
              conditions:
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value: medium
              tooltip: Zmień prędkość wentylatora
              tap_action:
                action: call-service
                service: vacuum.set_fan_speed
                service_data:
                  entity_id: vacuum.valetudo_dreame1
                  fan_speed: medium
            - icon_id: fan_speed_menu_high
              menu_id: fan_speed
              icon: mdi:fan-alert
              label: high
              conditions:
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value: high
              tooltip: Zmień prędkość wentylatora
              tap_action:
                action: call-service
                service: vacuum.set_fan_speed
                service_data:
                  entity_id: vacuum.valetudo_dreame1
                  fan_speed: high
            - icon_id: fan_speed_menu_max
              menu_id: fan_speed
              icon: mdi:fan-alert
              label: max
              conditions:
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value: max
              tooltip: Zmień prędkość wentylatora
              tap_action:
                action: call-service
                service: vacuum.set_fan_speed
                service_data:
                  entity_id: vacuum.valetudo_dreame1
                  fan_speed: max
            - icon_id: fan_speed_unknown
              icon: mdi:fan-alert
              conditions:
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value_not: low
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value_not: medium
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value_not: high
                - entity: vacuum.valetudo_dreame1
                  attribute: fan_speed
                  value_not: max
              tooltip: Zmień prędkość wentylatora
              tap_action:
                action: call-service
                service: vacuum.set_fan_speed
                service_data:
                  entity_id: vacuum.valetudo_dreame1
                  fan_speed: low
          tiles:
            - tile_id: fan_speed
              entity: vacuum.valetudo_dreame1
              label: Wentylator
              attribute: fan_speed
              icon: mdi:fan
              translations:
                silent: Cichy
                standard: Normalny
                medium: Średni
                turbo: Turbo
                auto: Automatyczny
                gentle: Delikatny
            - tile_id: battery_level
              label: Bateria
              unit: '%'
              entity: sensor.valetudo_dreame1_battery_level
              icon: mdi:battery
              precision: 0
              translations: {}
            - tile_id: filter_left
              label: Filtr
              icon: mdi:air-filter
              unit: h
              multiplier: 0.016666666666666666
              entity: sensor.valetudo_dreame1_main_filter
              precision: 0
              translations: {}
            - tile_id: main_brush_left
              label: Główna szczotka
              icon: mdi:brush
              unit: h
              multiplier: 0.016666666666666666
              entity: sensor.valetudo_dreame1_main_brush
              precision: 0
              translations: {}
            - tile_id: side_brush_left
              label: Boczna szczotka
              icon: mdi:brush
              unit: h
              multiplier: 0.016666666666666666
              entity: sensor.valetudo_dreame1_right_brush
              precision: 0
              translations: {}
            - tile_id: cleaned_area
              label: Powierzchnia
              icon: mdi:texture-box
              unit: m²
              multiplier: 0.0001
              entity: sensor.valetudo_dreame1_current_statistics_area
              precision: 0
              translations: {}
            - tile_id: cleaning_time
              label: Czas sprzątania
              icon: mdi:timer-sand
              unit: min
              multiplier: 0.016666666666666666
              entity: sensor.valetudo_dreame1_current_statistics_time
              precision: 0
              translations: {}
          additional_presets: []
