                      - 3015
                    - - 2620
                      - 3005
                    - - 2795
                      - 2985
                    - - 2990
                      - 2970
                    - - 3050
                      - 2970
                    - - 3050
                      - 3085
                    - - 3045
                      - 3195
                - id: '4'
                  icon:
                    name: mdi:broom
                    x: 3147
                    'y': 3457
                  label:
                    text: Salon
                    x: 3147
                    'y': 3457
                    offset_y: 35
                  outline:
                    - - 2945
