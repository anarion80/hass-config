action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Baterie
    size: NORMAL
    style: >
      --ha-card-border-radius: 0;
    content:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 500px 500px
        grid-template-rows: 1fr
        grid-template-areas: |
          "sensors devices"
        mediaquery:
          #phone
          "(max-width: 800px)":
            grid-template-columns: 1fr
            grid-template-rows: repeat(2, 1fr)
            grid-template-areas: |
              "sensors"
              "devices"
      cards:
        #################################################
        #                                               #
        #                Sensors                        #
        #                                               #
        #################################################

        - type: entities
          view_layout:
            grid-area: sensors
          title: Czujniki
          show_header_toggle: false
          entities:
            - type: custom:bar-card
              width: 55%
              height: 2em
              decimal: 0
              unit_of_measurement: "%"
              positions: &bar_card_positions
                icon: outside
                indicator: "off"
                name: outside
              severity: &bar_card_severity
                - color: "#6d2525"
                  from: 0
                  to: 20
                - color: "#303435"
                  from: 20
                  to: 90
                - color: "#006600"
                  from: 90
                  to: 100
              entity_row: true
              entities:
                - entity: sensor.button1_battery
                - entity: sensor.switch1_battery
                - entity: sensor.motion_sensor_1_battery
                - entity: sensor.alarm_keypad_battery
                - entity: sensor.drzwi_do_ogrodu_battery
                - entity: sensor.drzwi_wejsciowe_battery
                - entity: sensor.lazienka_bateria
                - entity: sensor.server_room_battery

        #################################################
        #                                               #
        #                    DEVICES                    #
        #                                               #
        #################################################

        - type: entities
          view_layout:
            grid-area: devices
          title: Urządzenia
          show_header_toggle: false
          entities:
            - type: custom:bar-card
              width: 55%
              height: 2em
              decimal: 0
              unit_of_measurement: "%"
              positions: *bar_card_positions
              severity: *bar_card_severity
              entity_row: true
              entities:
                - entity: sensor.ipad_iwona_battery_level
                - entity: sensor.moto_g85_5g_battery_level
                - entity: sensor.ta_1004_poziom_baterii
                - entity: sensor.kftrwi_battery_level
                #- entity: sensor.redmi_note_5_battery_level
                - entity: sensor.nokia_x20_battery_level
