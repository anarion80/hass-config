action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: TV w salonie
    content:
      type: vertical-stack
      cards:

        - type: entities
          state_color: true
          show_header_toggle: false
          entities:

            - entity: media_player.sony_kd_55xe9305
              name: Sony Bravia
              secondary_info: last-changed

            - type: custom:more-info-card
              entity: media_player.sony_kd_55xe9305
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: media_player.sony_kd_55xe9305
              icon: mdi:volume-mute
              tap_action:
                action: perform-action
                perform_action: media_player.volume_mute
                data:
                  entity_id: >
                    [[[ return entity.entity_id; ]]]
                  is_volume_muted: >
                    [[[ return entity.attributes.is_volume_muted === 'false' ? 'true' : 'false'; ]]]
              template: icon_only

            - type: custom:button-card
              entity: media_player.sony_kd_55xe9305
              icon: mdi:volume-minus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_down
                data:
                  entity_id: >
                    [[[ return entity.entity_id; ]]]
              template: icon_only

            - type: custom:button-card
              entity: media_player.sony_kd_55xe9305
              icon: mdi:volume-plus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_up
                data:
                  entity_id: >
                    [[[ return entity.entity_id; ]]]
              template: icon_only
