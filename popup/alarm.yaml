action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Alarm
    size: NORMAL
    style: >
      --ha-card-border-radius: 0;
    content:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: repeat(2, 1fr)
        grid-template-rows: 1fr
        grid-template-areas: |
          "panel entities"
        mediaquery:
          #phone
          "(max-width: 800px)":
            grid-template-columns: 1fr
            grid-template-rows: repeat(2, 1fr)
            grid-template-areas: |
              "panel"
              "entities"
      cards:

        - type: alarm-panel
          view_layout:
            grid-area: panel
          states:
            - arm_home
            - arm_away
          entity: alarm_control_panel.glowny_alarm
        - type: entities
          view_layout:
            grid-area: entities
          entities:
            - entity: binary_sensor.czujniki_ruchu
            - entity: binary_sensor.okna
            - entity: binary_sensor.drzwi
            - entity: binary_sensor.motion_sensor_1_occupancy
            - entity: binary_sensor.drzwi_wejsciowe_contact
            - entity: binary_sensor.drzwi_do_ogrodu_contact
