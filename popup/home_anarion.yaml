action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Anarion
    size: NORMAL
    content:
      type: vertical-stack
      cards:
        - type: entities
          entities:
            - entity: person.anarion
              secondary_info: last-changed

        - type: history-graph
          entities:
            - entity: person.anarion
          hours_to_show: 24
          refresh_interval: 0

        - type: glance
          show_state: false
          entities:
            - entity: device_tracker.16_50_29_49_06_7e
              name: Ruter
              icon: mdi:wifi
            - entity: device_tracker.pixel_10_pro_xl
              name: Pozycja
              icon: mdi:crosshairs-gps
        - type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            margin: 0
            grid-template-columns: max-content
            place-content: center
          cards:
            - type: custom:button-card
              name: Graj dźwięk na telefonie
              icon: mdi:volume-high
              template: icon_name
              tap_action:
                action: perform-action
                perform_action: script.anarion_find_my_iphone

        - type: map
          default_zoom: 16
          dark_mode: true
          entities:
            - device_tracker.pixel_10_pro_xl
          auto_fit: true
          hours_to_show: 24
