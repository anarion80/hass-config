action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Iwona
    size: NORMAL
    content:
      type: vertical-stack
      cards:
        - type: entities
          entities:
            - entity: person.iwona
              secondary_info: last-changed

        - type: history-graph
          entities:
            - entity: person.iwona
          hours_to_show: 24
          refresh_interval: 0

        - type: glance
          show_state: false
          entities:

            - entity: device_tracker.fa_fd_b8_bc_6a_a0
              name: Ruter
              icon: mdi:wifi
            - entity: device_tracker.iphone
              name: Pozycja
              icon: mdi:crosshairs-gps
        - type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            margin: 0
            grid-template-columns: max-content
            place-content: center
          cards:
            - type: custom:button-card
              name: Graj dźwięk na telefonie
              icon: mdi:volume-high
              template: icon_name
              tap_action:
                action: perform-action
                perform_action: script.iwona_find_my_iphone

        - type: map
          default_zoom: 16
          dark_mode: true
          entities:
            - device_tracker.iphone
