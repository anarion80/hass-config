action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: 🚮 Odbiór odpadów
    style: >
      --ha-card-border-radius: 0;
    size: NORMAL
    content:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 385px 385px
        grid-template-rows: 1fr
        grid-template-areas: |
          "buttons calendar"
        mediaquery:
          #phone
          "(max-width: 800px)":
            grid-template-columns: 1fr
            grid-template-rows: repeat(2, 1fr)
            grid-template-areas: |
              "buttons"
              "calendar"
      cards:

        - type: vertical-stack
          view_layout:
            grid-area: buttons
          cards:
            - type: custom:hui-horizontal-stack-card
              cards:
                - type: custom:button-card
                  entity: input_boolean.garbage_reminder
                  state:
                  - value: 'on'
                    icon: 'mdi:delete-restore'
                    name: 'Potwierdź wyniesienie śmieci'
                  - value: 'off'
                    icon: mdi:delete-empty
                    name: 'Śmieci wyniesione'
                  icon: mdi:reload
                  template: icon_name
              styles:
                name:
                  - text-align: center;
              template: icon_name

            # - type: custom:button-card
            #   #name: Śmieci
            #   entity: input_boolean.garbage_reminder
            #   show_state: false
            #   show_label: false
            #   show_name: true
            #   template:
            #     - basic
            #   state:
            #     - value: 'on'
            #       icon: 'mdi:delete-restore'
            #       name: 'Potwierdź wyniesienie śmieci'
            #     - value: 'off'
            #       icon: mdi:delete-empty
            #       name: 'Śmieci wyniesione'
            #   styles:
            #     name:
            #       - text-align: center;

        - type: vertical-stack
          view_layout:
            grid-area: calendar
          cards:
            - type: custom:atomic-calendar-revive
              #name: Śmieci
              entities:
                - entity: calendar.smieci_bio
                  titleColor: green
                - entity: calendar.smieci_segregowane
                  titleColor: yellow
                - entity: calendar.smieci_zmieszane
                  titleColor: black
              enableModeChange: true
              firstDayOfWeek: 1
              showDate: true
              sortByStartTime: false
              showCurrentEventLine: false
              showProgressBar: true
              showMonth: false
              showWeekDay: true
              showDescription: true
              disableLocationLink: false
              showNoEventsForToday: false
              showFullDayProgress: false
              showEventIcon: false
              maxDaysToShow: 60
