action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Klimat
    content:
      type: custom:tabbed-card
      styles:
        --mdc-theme-primary: var(--primary-text-color)
        --mdc-tab-text-label-color-default: rgba(var(--rgb-primary-text-color), 0.8)
        --mdc-typography-button-font-size: 14px
      tabs:
        - card:
            type: vertical-stack
            cards:
              - type: entities
                entities:

                  - type: custom:mushroom-climate-card
                    entity: climate.living_room_ac
                    name: Klimat
                    icon: mdi:home-thermometer
                    hvac_modes:
                      - 'off'
                      - cool
                      - fan_only
                    primary_info: name
                    secondary_info: state
                    show_temperature_control: false
                  - type: custom:mushroom-climate-card
                    entity: climate.living_room_ac
                    icon_type: none
                    secondary_info: none
                    primary_info: none
                    show_temperature_control: true
                  - type: custom:more-info-card
                    entity: climate.living_room_ac
                  - entity: sensor.salon_temperatura
                    name: Temperatura
                  - entity: sensor.komfovent_status_panel_humidity
                    name: Wilgotność

              - type: custom:apexcharts-card
                layout: minimal
                locale: pl
                graph_span: 8h
                show:
                  loading: false
                apex_config:
                  plotOptions:
                    area:
                      fillTo: end
                  grid:
                    padding:
                      top: -15
                  fill:
                    type: gradient
                    gradient:
                      type: vertical
                      opacityFrom: 0.8
                      opacityTo: 0
                      stops:
                        - 0
                        - 99
                        - 100
                  stroke:
                    width: 4
                  tooltip:
                    style:
                      fontSize: 14px
                    x:
                      format: dddd HH:mm
                  chart:
                    height: 100px
                    offsetY: -20px
                  xaxis:
                    crosshairs:
                      show: false
                series:
                  - entity: sensor.salon_temperatura
                    name: Temp
                    color: '#385581'
                    type: area
                    fill_raw: last
                    group_by:
                      func: avg
                      duration: 1h
          attributes:
            label: AC
        - card:
            type: vertical-stack
            cards:
              - type: entities
                entities:
                  - entity: binary_sensor.drzwi_wejsciowe_contact
                    name: Drzwi wejściowe
                    icon: mdi:window-closed

          attributes:
            label: Timer
