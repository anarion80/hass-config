action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Ustawienia
    # See popup/footer_updates.yaml for the full explanation (`initial_style` + an inline
    # `popup_styles` entry, because browser_mod has no place to define popup styles
    # globally); `narrower` is the 460px variant. A single-entry `style_sequence` keeps
    # the title tap from widening this one.
    initial_style: narrower
    style_sequence:
      - narrower
    popup_styles:
      - style: narrower
        include_styles:
          - normal
        styles: |
          --popup-min-width: min(92vw, 460px);
          --popup-max-width: min(92vw, 460px);
          --popup-width-full: min(92vw, 460px);
    content:
      type: vertical-stack
      cards:
        - type: entities
          state_color: true
          entities:

            - entity: automation.turn_on_sprinkler
              name: Automatyczne włączanie zraszacza

            - type: custom:slider-entity-row
              entity: input_number.watering_time

            - type: custom:hui-element
              card_type: custom:layout-card
              layout_type: custom:grid-layout
              layout:
                margin: 0
                grid-template-columns: max-content
                place-content: center
              cards:
                - type: custom:button-card
                  name: Uruchom zraszacz
                  icon: mdi:sprinkler-variant
                  tap_action:
                    action: perform-action
                    perform_action: script.turn_on
                    data:
                      entity_id: script.sprinkler
                      variables:
                        minutes: >
                          [[[ return states['input_number.watering_time'].state; ]]]
                  template: icon_name

            - type: custom:slider-entity-row
              entity: input_number.heating_time

            - entity: input_datetime.heating_start

