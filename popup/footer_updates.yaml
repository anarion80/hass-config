action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Aktualizacje
    size: NORMAL
    content:
      type: grid
      columns: 1
      square: false
      cards:
        - type: custom:button-card
          entity: sensor.current_version
          template: updates_hass
          variables:
            available: sensor.template_updates
            latest: sensor.hass_version_latest
            latest_beta: sensor.hass_version_latest_beta
            release_notes: sensor.hass_release_notes
            release_notes_beta: sensor.hass_release_notes_beta

        - type: custom:button-card
          entity: sensor.current_version
          name: Aktualizuj HASS
          icon: mdi:update
          variables:
            latest: sensor.hass_version_latest
            latest_beta: sensor.hass_version_latest_beta
          # styles:
          #   card:
          #     - width: max-content
          #     - filter: >
          #         [[[
          #           return `[[[
          #             if (entity) {
          #               return entity.state === states['sensor.hass_version_latest'].state ||
          #                 entity.state === states['sensor.hass_version_latest_beta'].state
          #                   ? 'opacity(30%)'
          #                   : 'drop-shadow(3px 3px 5px #00000050)';
          #             }
          #           ]]]`
          #         ]]]
          #     - display: >
          #         [[[
          #           return `[[[
          #             return entity
          #               ? 'flex'
          #               : 'none';
          #           ]]]`
          #         ]]]
          tap_action:
            action: perform-action
            perform_action: browser_mod.sequence
            data:
              sequence:
                - service: browser_mod.notification
                  data:
                    message: Starting update...
                - service: script.turn_on
                  data:
                    entity_id: script.homeassistant_core_update
          template: updates_hass_icon_name

        ### HACS
        - type: custom:button-card
          variables:
            updates: sensor.template_updates
            supervisor_updates: sensor.supervisor_updates
            hacs_installed: sensor.hacs_installed
          template: updates

        - type: custom:button-card
          entity: sensor.hacs
          name: Otwórz HACS
          # `template` entries are resolved literally, so the js template that used
          # to sit here always threw "Button-card template '...' is missing!" and
          # this card rendered as an error card. The platform switch now lives in
          # the action (`hacs_iframe` / `hacs_navigate_ios` are kept for reference).
          template: updates_hacs_icon_name
          tap_action: |
            [[[
              // `hass.panels.hacs` only exists for administrators, so on a restricted
              // session (e.g. the non-admin "Tablet" kiosk user) this threw a TypeError
              // on tap and the row did nothing. Fall back to a no-op action.
              const url_path = hass.panels?.hacs?.url_path;
              if (!url_path) {
                return { action: 'none' };
              }
              const url = `/${url_path}`;
              return window.navigator.userAgent.match(/iPhone/i)
                ? {
                    action: 'fire-dom-event',
                    browser_mod: {
                      service: 'browser_mod.javascript',
                      data: {
                        code: `window.location.href = '${url}';`
                      }
                    }
                  }
                : {
                    action: 'fire-dom-event',
                    browser_mod: {
                      service: 'browser_mod.popup',
                      data: {
                        title: 'HACS',
                        size: 'fullscreen',
                        content: {
                          type: 'iframe',
                          aspect_ratio: '16x9.15',
                          url
                        }
                      }
                    }
                  };
            ]]]

        ### supervisor
        - type: custom:button-card
          entity: sensor.supervisor_updates
          template: updates_supervisor

        - type: custom:button-card
          entity: sensor.supervisor_updates
          name: Otwórz Supervisor
          icon: mdi:open-in-new
          styles:
            card:
              - width: max-content
              - filter: >
                  [[[
                    return states['binary_sensor.template_supervisor_update']?.state === 'off' ?
                      'opacity(30%)' :
                      'drop-shadow(3px 3px 5px #00000050)';
                  ]]]
          template: supervisor_iframe
