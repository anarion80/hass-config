action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Temperatury
    initial_style: normal
    popup_styles:
      - style: normal
        styles: |
          ha-dialog {
            --popup-width: 650px;
            --popup-min-height: 85vh;
          }
      - style: wide
        styles: |
          ha-dialog {
            --dialog-content-padding: 30px;
          }
      - style: all
        styles: |
          ha-dialog {
            --popup-max-width: 1000px;
            --ha-card-border-radius: 0px;
            --dialog-content-padding: 30px;
          }
    content:
      type: grid
      columns: 4
      square: true
      cards:
        - type: custom:button-card
          entity: sensor.temperatura_salon
          name: Salon
          double_tap_action: none
          custom_fields:
            graph:
              card:
                entities:
                  - sensor.temperatura_salon
          template:
            - base
            - icon_temperature
            - temperature_chart
            - graph
          styles:
            name:
              - font-size: 1vw
              - font-weight: var(--button-card-font-weight)
              - letter-spacing: var(--button-card-letter-spacing)
            state:
              - font-size: 1vw
              - font-weight: var(--button-card-font-weight)
              - letter-spacing: var(--button-card-letter-spacing)

        - type: custom:button-card
