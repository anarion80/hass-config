action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Temperatury
    initial_style: normal
    # This popup was already on the current config model, and its `--popup-width: 650px`
    # did work - a popup style lands as `:host([normal]) ha-dialog { ... }`, which
    # outranks browser_mod's own `ha-dialog { --popup-width: ... }` - but it pinned this
    # popup to a fixed 650px. Its `--popup-max-width: 1000px` did nothing: that value
    # only becomes `--ha-dialog-max-width`, which caps the outer `wa-dialog` box, while
    # the visible surface is sized by `--popup-width`. Both are gone; the theme pins
    # every normal popup's width (two thirds of the screen), while height is content-sized.
    popup_styles:
      - style: wide
        styles: |
          ha-dialog {
            --dialog-content-padding: 30px;
          }
      - style: all
        styles: |
          ha-dialog {
            --ha-card-border-radius: 0px;
            --dialog-content-padding: 30px;
          }
    content:
      type: grid
      columns: 4
      square: true
      cards:
        - type: custom:button-card
          entity: sensor.temperatura_salon
          name: Salon
          double_tap_action: none
          custom_fields:
            graph:
              card:
                entities:
                  - sensor.temperatura_salon
          template:
            - base
            - icon_temperature
            - temperature_chart
            - graph
          styles:
            name:
              - font-size: 1vw
              - font-weight: var(--button-card-font-weight)
              - letter-spacing: var(--button-card-letter-spacing)
            state:
              - font-size: 1vw
              - font-weight: var(--button-card-font-weight)
              - letter-spacing: var(--button-card-letter-spacing)

        - type: custom:button-card
