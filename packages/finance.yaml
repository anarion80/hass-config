automation:
  - id: stopa_bazowa_change_notification_up
    alias: Notify when stopa bazowa changes up
    description: ""
    trigger:
      - trigger: state
        entity_id: sensor.stopa_bazowa_pko_bp
    condition:
      # Only act on a real numeric change: skip unknown/unavailable (e.g. the PKO API
      # returns nulls on bank holidays, and at startup before the first fetch), which
      # would otherwise be read as 0 and fire a bogus "changed to 0%" notification.
      - condition: template
        value_template: >-
          {%- set before = trigger.from_state.state if trigger.from_state else 'unknown' -%}
          {%- set after = trigger.to_state.state if trigger.to_state else 'unknown' -%}
          {{ before | is_number and after | is_number and after | float > before | float }}
    action:
      - action: notify.pushover
        data:
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
      - action: notify.mobile_app_pixel_10_pro_xl
        data:
          title: Zmiana stopy bazowej
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
          data:
            ttl: 0
      - action: notify.email_anarion
        data:
          title: Zmiana stopy bazowej
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.stopa_bazowa_rising
    mode: single
  - id: stopa_bazowa_change_notification_down
    alias: Notify when stopa bazowa changes down
    description: ""
    trigger:
      - trigger: state
        entity_id: sensor.stopa_bazowa_pko_bp
    condition:
      - condition: template
        value_template: >-
          {%- set before = trigger.from_state.state if trigger.from_state else 'unknown' -%}
          {%- set after = trigger.to_state.state if trigger.to_state else 'unknown' -%}
          {{ before | is_number and after | is_number and after | float < before | float }}
    action:
      - action: notify.pushover
        data:
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
      - action: notify.mobile_app_pixel_10_pro_xl
        data:
          title: Zmiana stopy bazowej
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
          data:
            ttl: 0
      - action: notify.email_anarion
        data:
          title: Zmiana stopy bazowej
          message: Stopa bazowa zmieniła się z {{ trigger.from_state.state }}% na {{
            trigger.to_state.state}}%!
      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.stopa_bazowa_rising
    mode: single
  - id: wibor6m_change_notification_down
    alias: Notify when Wibor 6M changes down
    description: ""
    trigger:
      - trigger: state
        entity_id: sensor.wibor_6m
    condition:
      - condition: template
        value_template: >-
