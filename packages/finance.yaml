input_boolean:
  stopa_bazowa_rising:
    name: Stopa Bazowa is rising
    icon: mdi:trending-up

  wibor6m_rising:
    name: Wibor6M is rising
    icon: mdi:trending-up

input_number:
  tauron_cost:
    name: Cena prądu
    initial: 0
    min: 0
    max: 10
    step: 0.01
    mode: box
    unit_of_measurement: "PLN/kWh"
    icon: mdi:currency-usd

rest:
  # pkobh.pl/stawki-miedzybankowe is a Next.js app now: the rates are no longer in
  # the served HTML (that is why `#base_rate > p:nth-child(4)` and
  # `.course__table > tbody...` stopped matching - "Index '0' not found"), they are
  # fetched client-side from the site's own JSON API. That API needs an explicit
  # date and only returns values for dates that have a fixing (nulls otherwise), so
  # ask for the last business day: Mon -> Fri, Sat/Sun -> Fri, Tue-Fri -> yesterday.
  # Polish bank holidays come back null, i.e. the sensor reads 'unknown' that day.
  - resource_template: >-
      {%- set weekday = now().weekday() -%}
      {%- set days_back = 3 if weekday == 0 else (1 if weekday < 5 else weekday - 4) -%}
      https://www.pkobh.pl/api/modules/fxrates/interbank/rates?date={{
      (now() - timedelta(days=days_back)).strftime('%Y-%m-%d') }}
    scan_interval: 7200
    sensor:
      - name: Wibor 6M
        value_template: >-
          {%- set rates = (value_json.wibor if value_json is defined else none) or {} -%}
          {{ rates.m6 | default('unknown') }}
        unit_of_measurement: "%"
        state_class: measurement

  - resource_template: >-
      {%- set weekday = now().weekday() -%}
      {%- set days_back = 3 if weekday == 0 else (1 if weekday < 5 else weekday - 4) -%}
      https://www.pkobh.pl/api/modules/fxrates/fixed/rates?date={{
      (now() - timedelta(days=days_back)).strftime('%Y-%m-%d') }}
    scan_interval: 7200
    sensor:
      - name: Stopa bazowa PKO BP
        value_template: >-
          {%- set rates = (value_json.base if value_json is defined else none) or {} -%}
          {{ rates.value | default('unknown') }}
        unit_of_measurement: "%"
        state_class: measurement
