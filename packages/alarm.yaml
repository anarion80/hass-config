alarm_control_panel:
  - platform: manual
    name: Główny alarm
    code: !secret main_alarm_code
    arming_time: 30
    delay_time: 20
    trigger_time: 4
    disarmed:
      trigger_time: 0
    armed_home:
      arming_time: 0
      delay_time: 0
      trigger_time: 60
    armed_away:
      delay_time: 60
      trigger_time: 60

automation:
  # - id: '1617367166600'
  #   alias: Motion Detected
  #   description: ''
  #   use_blueprint:
  #     path: vorion/send-camera-snapshot-notification-on-motion.yaml
  #     input:
  #       notification_message: '{{ motion_sensor_name }} - wykryto ruch!'
  #       motion_sensor: binary_sensor.camera1_motion
  #       camera: camera.camera1
  #       notify_device: b0c171c0e7c87b51e2a35c49fd79e5ff
  #       notification_title: Wykryto ruch!
  #       delay: 2

  - id: "1617387394300"
    alias: Frigate person detection notification
    description: ""
    trace:
      stored_traces: 10
    trigger:
      - trigger: mqtt
        topic: frigate/events
    condition:
      condition: and
      conditions:
        - condition: state
          entity_id: person.anarion
          state: "not_home"
        - condition: state
          entity_id: person.iwona
          state: "not_home"
    action:
      - action: notify.mobile_app_pixel_10_pro_xl
        data:
          message: '{{trigger.payload_json["after"]["label"]}} wykryty w
            {{trigger.payload_json["after"]["camera"]}}'
          data:
            image: https://ha.anarion.pl/api/frigate/frigate/notifications/{{trigger.payload_json['after']['id']}}/snapshot.jpg
            tag: '{{trigger.payload_json["after"]["id"]}}'
            when: '{{trigger.payload_json["after"]["start_time"]|int}}'
            data:
              ttl: 0
              priority: high
    mode: single

  - id: "1617387394301"
    alias: Frigate person detection notification - popup
    description: "Frigate person detection notification - popup"
    trigger:
      - trigger: mqtt
        topic: frigate/events
    action:
      - action: switch.turn_on
        target:
          entity_id: switch.fire_tablet_screen
        # data:
        #   brightness_pct: >
        #     {{ is_state('sun.sun', 'above_horizon') | iif(90, 65) }}
      - action: browser_mod.more_info
        data:
          entity: >
            camera.{{trigger.payload_json["after"]["camera"]}}_2
          browser_id:
            - amazon_tablet
          large: true
          ignore_popup_card: true
      - delay:
          minutes: 1
      - action: browser_mod.close_popup
        data:
          browser_id: amazon_tablet
      - action: switch.turn_off
        data:
          entity_id: switch.fire_tablet_screen
    mode: single

  - id: "1618433673900"
    alias: Notify on device unavailable
    description: ""
    trigger:
      - trigger: state
        entity_id:
          - binary_sensor.alarm_keypad_contact
          - binary_sensor.drzwi_do_ogrodu_contact
          - binary_sensor.drzwi_wejsciowe_contact
          - binary_sensor.motion_sensor_1_battery_low
          - switch.server_power
          - binary_sensor.okno_wodomierz_lewe_contact
          - binary_sensor.okno_wodomierz_prawe_contact
          - binary_sensor.okno_wejscie_contact
        to: unavailable
        for: 0:05:00
    condition: []
    action:
      - action: notify.mobile_app_pixel_10_pro_xl
        data:
          title: Urządzenie niedostępne!
          data:
            channel: Notfall
            priority: high
            ttl: 0
            color: red
          message: 📵 {{ state_attr(trigger.to_state.entity_id, 'friendly_name') }} jest
            niedostępne od 5 minut!
    mode: parallel
    max: 10

  - id: trigger_alarm_while_armed
    alias: Trigger alarm while armed
    trigger:
      - trigger: state
        entity_id: binary_sensor.okna
        to: "on"
      - trigger: state
        entity_id: binary_sensor.drzwi
        to: "on"
      - trigger: state
        entity_id: binary_sensor.czujniki_ruchu
        to: "on"
    condition:
      - condition: or
        conditions:
          - condition: state
            entity_id: alarm_control_panel.glowny_alarm
            state: armed_away
          - condition: state
            entity_id: alarm_control_panel.glowny_alarm
            state: armed_home
    action:
      - action: alarm_control_panel.alarm_trigger
        target:
          entity_id: alarm_control_panel.glowny_alarm
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm został wyzwolony! Wpisz poprawny kod!
        target:
          entity_id: tts.google_cloud_2
      - action: light.turn_on
        data:
          entity_id: light.fire_tablet_screen
          brightness_pct: "{{ 90 if is_state('sun.sun', 'above_horizon') else 60 }}"
    mode: single
  - id: send_notification_when_alarm_is_disarmed
    alias: Send notification when alarm is disarmed
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: disarmed
    action:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm został rozbrojony!
        target:
          entity_id: tts.google_cloud_2
  - id: send_notification_when_alarm_is_in_pending_status
    alias: Send notification when alarm is in pending status
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: pending
    action:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm się włącza! Wpisz poprawny kod!
        target:
          entity_id: tts.google_cloud_2
      - action: light.turn_on
        data:
          entity_id: light.fire_tablet_screen
          brightness_pct: "{{ 90 if is_state('sun.sun', 'above_horizon') else 60 }}"
  - id: send_notification_when_alarm_is_armed_in_away_mode
    alias: Send notification when alarm is armed in away mode
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: armed_away
    action:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm uzbrojony!
        target:
          entity_id: tts.google_cloud_2
  - id: send_notification_when_alarm_is_armed_in_home_mode
    alias: Send notification when alarm is armed in home mode
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: armed_home
    action:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm uzbrojony!
        target:
          entity_id: tts.google_cloud_2
  - id: send_notification_when_alarm_is_triggered
    alias: Send notification when alarm is triggered
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: triggered
    action:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Uwaga, alarm został faktycznie wyzwolony!
        target:
          entity_id: tts.google_cloud_2
      - action: notify.mobile_app_pixel_10_pro_xl
        data:
          message: "Uwaga: Alarm w domu został wyzwolony - {{ states('sensor.date_time')
            }}!"
          data:
            ttl: 0
            priority: high
      - action: light.turn_on
        data:
          entity_id: light.fire_tablet_screen
          brightness_pct: "{{ 90 if is_state('sun.sun', 'above_horizon') else 60 }}"

  - id: "sync_alarm_status"
    alias: sync_alarm_status
    description: Synchronize alarm status with keypad
    variables:
      pin_var: !secret main_alarm_code
    trigger:
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: arming
        id: panel_arming
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: armed_home
        id: panel_armed_home
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: disarmed
        id: panel_disarmed
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: armed_away
        id: panel_armed_away
      - trigger: state
        entity_id: alarm_control_panel.glowny_alarm
        to: pending
        id: panel_pending
      - trigger: mqtt
        topic: zigbee2mqtt/alarm_keypad
        id: keypad_mqtt
    condition: []
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: panel_arming
            sequence:
              - choose:
                  - conditions:
                      - condition: state
                        entity_id: alarm_control_panel.glowny_alarm
                        state: armed_home
                        attribute: next_state
                    sequence:
                      - action: mqtt.publish
                        data_template:
                          topic: zigbee2mqtt/alarm_keypad/set
                          payload: "{

                            \ \"arm_mode\":\ 

                            \  {

                            \   \"mode\": \"arm_day_zones\"

                            \  }

                            }"
                  - conditions:
                      - condition: state
                        entity_id: alarm_control_panel.glowny_alarm
                        state: armed_away
                        attribute: next_state
                    sequence:
                      - action: mqtt.publish
                        data_template:
                          topic: zigbee2mqtt/alarm_keypad/set
                          payload: "{

                            \ \"arm_mode\":\ 

                            \  {

                            \   \"mode\": \"exit_delay\"

                            \  }

                            }"
                default: []
            # - choose:
            #   default: !input 'action_arming'
          - conditions:
              - condition: trigger
                id: panel_armed_away
            sequence:
              - action: mqtt.publish
                data_template:
                  topic: zigbee2mqtt/alarm_keypad/set
                  payload: "{

                    \ \"arm_mode\":\ 

                    \  {

                    \   \"mode\": \"arm_all_zones\"

                    \  }

                    }"
            # - choose:
            #   default: !input 'action_armed_away'
          - conditions:
              - condition: trigger
                id: panel_disarmed
            sequence:
              - action: mqtt.publish
                data_template:
                  topic: zigbee2mqtt/alarm_keypad/set
                  payload: "{

                    \ \"arm_mode\":\ 

                    \  {

                    \    \"mode\": \"disarm\"

                    \  }

                    }"
            # - choose:
            #   default: send_notification_when_alarm_is_disarmed
          - conditions:
              - condition: trigger
                id: panel_armed_home
            sequence:
              - action: mqtt.publish
                data_template:
                  topic: zigbee2mqtt/alarm_keypad/set
                  payload: "{

                    \ \"arm_mode\":\ 

                    \  {

                    \   \"mode\": \"arm_day_zones\"

                    \  }

                    }"
            # - choose:
            #   default: send_notification_when_alarm_is_armed_in_home_mode
            # - conditions:
            #   - condition: trigger
            #     id: panel_pending
            #   sequence:
            # - choose:
            #   default: send_notification_when_alarm_is_in_pending_status
          - conditions:
              - condition: trigger
                id: keypad_mqtt
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.payload_json.action_transaction != null and
                          trigger.payload_json.action_code == pin_var }}"
                    sequence:
                      - action: mqtt.publish
                        data_template:
                          topic: zigbee2mqtt/alarm_keypad/set
                          payload: "{

                            \ \"arm_mode\":\ 

                            \  {

                            \    \"transaction\": \"{{
                            trigger.payload_json.action_transaction }}\",

                            \    \"mode\": \"{{ trigger.payload_json.action }}\"

                            \  }

                            }"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: '{{ trigger.payload_json.action_code == pin_var and
                          trigger.payload_json.action == "arm_all_zones" }}'
                    sequence:
                      - action: alarm_control_panel.alarm_arm_away
                        target:
                          entity_id: alarm_control_panel.glowny_alarm
                        data:
                          code: !secret main_alarm_code
                  - conditions:
                      - condition: template
                        value_template: '{{ trigger.payload_json.action_code == pin_var and
                          trigger.payload_json.action == "arm_day_zones" }}'
                    sequence:
                      - action: alarm_control_panel.alarm_arm_home
                        target:
                          entity_id: alarm_control_panel.glowny_alarm
                        data:
                          code: !secret main_alarm_code
                  - conditions:
                      - condition: template
                        value_template: '{{ trigger.payload_json.action_code == pin_var and
                          trigger.payload_json.action == "disarm" }}'
                    sequence:
                      - action: alarm_control_panel.alarm_disarm
                        target:
                          entity_id: alarm_control_panel.glowny_alarm
                        data:
                          code: !secret main_alarm_code
                  # - conditions:
                  #   - condition: template
                  #     value_template: '{{ trigger.payload_json.action == "panic" }}'
                  #   sequence:
                  #   - choose:
                  #     default: !input 'action_panic'
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.payload_json.action_code != pin_var and
                          trigger.payload_json.action_code | int(-1) != -1 }}"
                    sequence:
                      - action: mqtt.publish
                        data_template:
                          topic: zigbee2mqtt/alarm_keypad/set
                          payload: "{

                            \ \"arm_mode\":\ 

                            \  {

                            \   \"transaction\": \"{{
                            trigger.payload_json.action_transaction }}\",

                            \   \"mode\": \"invalid_code\"

                            \  }

                            }"
                  - conditions:
                      - condition: template
                        value_template: "{{ trigger.payload_json.action == None }}"
                    sequence:
                      - choose:
                          - conditions:
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: armed_away
                            sequence:
                              - action: mqtt.publish
                                data_template:
                                  topic: zigbee2mqtt/alarm_keypad/set
                                  payload: "{

                                    \ \"arm_mode\":\ 

                                    \  {

                                    \   \"mode\": \"arm_all_zones\"

                                    \  }

                                    }"
                          - conditions:
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: armed_home
                            sequence:
                              - action: mqtt.publish
                                data_template:
                                  topic: zigbee2mqtt/alarm_keypad/set
                                  payload: "{

                                    \ \"arm_mode\":\ 

                                    \  {

                                    \   \"mode\": \"arm_day_zones\"

                                    \  }

                                    }"
                          - conditions:
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: disarmed
                            sequence:
                              - action: mqtt.publish
                                data_template:
                                  topic: zigbee2mqtt/alarm_keypad/set
                                  payload: "{

                                    \ \"arm_mode\":\ 

                                    \  {

                                    \   \"mode\": \"disarm\"

                                    \  }

                                    }"
                          - conditions:
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: arming
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: armed_home
                                attribute: next_state
                            sequence:
                              - action: mqtt.publish
                                data_template:
                                  topic: zigbee2mqtt/alarm_keypad/set
                                  payload: "{

                                    \ \"arm_mode\":\ 

                                    \  {

                                    \   \"mode\": \"arm_day_zones\"

                                    \  }

                                    }"
                          - conditions:
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: arming
                              - condition: state
                                entity_id: alarm_control_panel.glowny_alarm
                                state: armed_away
                                attribute: next_state
                            sequence:
                              - action: mqtt.publish
                                data_template:
                                  topic: zigbee2mqtt/alarm_keypad/set
                                  payload: "{

                                    \ \"arm_mode\":\ 

                                    \  {

                                    \   \"mode\": \"arm_all_zones\"

                                    \  }

                                    }"
                default: []
        default: []
    mode: parallel
    max: 10

