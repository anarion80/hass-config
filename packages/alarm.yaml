script:
  release_the_dog_2:
    alias: Release the dog 2
    sequence:
      - repeat:
          count: "10"
          sequence:
            - action: media_player.play_media
              target:
                entity_id: media_player.nest_mini
              data:
                media_content_id: /local/mixkit-annoyed-big-dog-barking-51.wav
                media_content_type: music
            - action: media_player.play_media
              target:
                entity_id: media_player.nest_mini
              data:
                media_content_id: /local/mixkit-giant-dog-aggressive-growl-59.wav
                media_content_type: music
    mode: queued

template:
  - sensor:
      - default_entity_id: sensor.alarm_status
        name: Status alarmu
        state: '{%- if (states(''alarm_control_panel.glowny_alarm'') == "disarmed") -%}
          rozbrojony {%- elif (states(''alarm_control_panel.glowny_alarm'') ==
          "arming") -%} uzbrajanie {%- elif
          (states(''alarm_control_panel.glowny_alarm'') == "armed_home") -%} w
          domu {%- elif (states(''alarm_control_panel.glowny_alarm'') ==
          "armed_away") -%} poza domem {%- elif
          (states(''alarm_control_panel.glowny_alarm'') == "armed_night") -%}
          nocny {%- elif (states(''alarm_control_panel.glowny_alarm'') ==
          "armed_custom_bypass") -%} custom {%- elif
          (states(''alarm_control_panel.glowny_alarm'') == "pending") -%} w
          trakcie {%- elif (states(''alarm_control_panel.glowny_alarm'') ==
          "triggered") -%} wyzwolony {%- endif %}'
