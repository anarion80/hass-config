binary_sensor:
  - name: "Anarion Home"
    platform: "bayesian"
    prior: 0.9
    probability_threshold: 0.7
    observations:
      - platform: template
        value_template: >
          {{is_state('device_tracker.pixel_10_pro_xl','not_home') and
          ((as_timestamp(now()) -
          as_timestamp(states.device_tracker.pixel_10_pro_xl.last_changed)) >
          300)}}
        prob_given_true: 0.8
        prob_given_false: 0.2
      # - platform: template
      #   value_template: >
      #     {{is_state('device_tracker.16_50_29_49_06_7e','not_home') and ((as_timestamp(now()) - as_timestamp(states.device_tracker.16_50_29_49_06_7e.last_changed)) > 300)}}
      #   prob_given_true: 0.95
      #   prob_given_false: 0.05

group:
  people:
    entities:
      - person.anarion
      - person.iwona
      - person.hania
  glosniki:
    entities:
      - media_player.googlehome6577
      - media_player.nest_mini

homeassistant:
  customize:
    #person
    person.anarion:
      entity_picture: /local/anarion.png
    person.iwona:
      entity_picture: /local/iwona.png
    device_tracker.pixel_10_pro_xl:
      entity_picture: /local/anarion.png
    device_tracker.mobile_app_nokia_8_3_5g_2:
      entity_picture: /local/hania.png
    device_tracker.iphone:
      entity_picture: /local/iwona.png

mqtt:
  sensor:
    - name: anarion_last_changed
      state_topic: homeassistant/persistence/anarion
      value_template: >
        {{ value | replace(' ', 'T') }}

    - name: iwona_last_changed
      state_topic: homeassistant/persistence/iwona
      value_template: >
        {{ value | replace(' ', 'T') }}

    - name: hania_last_changed
      state_topic: homeassistant/persistence/hania
      value_template: >
        {{ value | replace(' ', 'T') }}

template:
  - sensor:
      - unique_id: people_at_home
        default_entity_id: sensor.people_at_home
        icon: "{%- set icons = ['account-off', 'account', 'account-multiple'] %} {%- set
          people = expand('group.people') %} {%- set cnt = people |
          selectattr('state', 'in', ['home', 'on'] ) | list | count %} {%- if
          cnt >= 0 %}

          \  mdi:{{ icons[cnt] if cnt in range(icons | count) else
          'account-group' }}

          {%- else %}

          \  mdi:account-alert

          {%- endif %}"
        attributes:
          people: "{%- set people = expand('group.people') | selectattr('state', 'eq',
            'home') | map(attribute='name') | list %} {%- set company =
            expand('group.people') | selectattr('state', 'eq', 'on') |
            map(attribute='name') | list %} {%- set people = people + company %}
            {{ people }}"
          and: "{%- set people = expand('group.people') | selectattr('state', 'eq',
            'home') | map(attribute='name') | list %} {%- set company =
            expand('group.people') | selectattr('state', 'eq', 'on') |
            map(attribute='name') | list %} {%- set people = people + company %}
            {%- if people | count > 0 %}

            \  {{- [people[:-1] | join(', '), 'and', people[-1]] | join(' ') if
            people | count > 1 else people[0] }}

            {%- else %}unknown {%- endif %}"
          or: "{%- set people = expand('group.people') | selectattr('state', 'eq', 'home')
            | map(attribute='name') | list %} {%- set company =
            expand('group.people') | selectattr('state', 'eq', 'on') |
            map(attribute='name') | list %} {%- set people = people + company %}
            {%- if people | count > 0 %}

            \  {{- [people[:-1] | join(', '), 'or', people[-1]] | join(' ') if
            people | count > 1 else people[0] }}

            {%- else %}unknown {%- endif %}"
          count: "{%- set people = expand('group.people') | selectattr('state', 'eq',
            'home') | map(attribute='name') | list %} {%- set company =
            expand('group.people') | selectattr('state', 'eq', 'on') |
            map(attribute='name') | list %} {%- set people = people + company %}
            {{ people | count }}"
        name: People at Home
        state: "{%- set people = expand('group.people') %} {{ people |
          selectattr('state', 'in', ['home', 'on'] ) | list | count }}"

