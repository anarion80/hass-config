script:
  anarion_find_my_iphone:
    sequence:
      - repeat:
          count: 3
          sequence:
            - action: notify.mobile_app_pixel_10_pro_xl
              data:
                title: Znajdź mój telefon
                message: Tu jestem
                data:
                  ttl: 0
                  priority: high
                  channel: alarm_stream
            - delay:
                seconds: 4

  iwona_find_my_iphone:
    sequence:
      - repeat:
          count: 3
          sequence:
            - action: notify.mobile_app_iphone
              data:
                message: "command_ringer_mode"
                data:
                  command: "normal"
            - action: notify.mobile_app_iphone
              data:
                message: "command_volume_level"
                data:
                  media_stream: "alarm_stream"
                  command: 20
            - action: notify.mobile_app_iphone
              data:
                title: Znajdź mój telefon
                message: Tu jestem
                data:
                  ttl: 0
                  priority: high
                  channel: alarm_stream
            - delay:
                seconds: 4

  hania_find_my_iphone:
    sequence:
      - repeat:
          count: 3
          sequence:
            - action: notify.mobile_app_nokia_8_3_5g_2
              data:
                message: "command_ringer_mode"
                data:
                  command: "normal"
            - action: notify.mobile_nokia_8_3_5g_2
              data:
                message: "command_volume_level"
                data:
                  media_stream: "alarm_stream"
                  command: 20
            - action: notify.mobile_app_nokia_8_3_5g_2
              data:
                title: Znajdź mój telefon
                message: Tu jestem
                data:
                  ttl: 0
                  priority: high
                  channel: alarm_stream
            - delay:
                seconds: 4
  iwona_odbierz_telefon:
    alias: Iwona odbierz telefon
    sequence:
      - action: tts.speak
        data:
          media_player_entity_id: media_player.nest_mini
          message: Iwona, odbierz telefon
        target:
          entity_id: tts.google_cloud_2
    mode: single
    icon: mdi:blur

