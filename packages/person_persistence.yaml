automation:
  - alias: person_home
    id: "8423590985012"
    mode: parallel
    trigger:
      - trigger: state
        entity_id:
          - person.anarion
          - person.iwona
          - person.hania
        from:
          - home
          - not_home
        to:
          - home
          - not_home
    action:
      action: mqtt.publish
      data:
        topic: >
          homeassistant/persistence/{{ trigger.to_state.name | lower }}
        payload: >
          {{ now() }}
        retain: true

  - id: "1613993960200"
    alias: Anarion is out of home
    description: ""
    use_blueprint:
      path: homeassistant/notify_leaving_zone.yaml
      input:
        person_entity: person.anarion
        zone_entity: zone.home
        notify_device: 1a6834c951c46f58d3c05318125bd343

  - id: "1613996396700"
    alias: Iwona is out
    description: ""
    use_blueprint:
      path: homeassistant/notify_leaving_zone.yaml
      input:
        person_entity: person.iwona
        zone_entity: zone.home
        notify_device: 1a6834c951c46f58d3c05318125bd343

  - id: "1614021562500"
    alias: Notify when redmi note 5 battery level is lower than 5
    description: ""
    trigger:
      - trigger: numeric_state
        below: "5"
        entity_id: sensor.redmi_note_5_battery_level
    condition:
      - condition: time
        after: "08:00"
        before: "20:00"
    action:
      - action: tts.google_cloud_say
        data:
          message: Iwona, bateria w telefonie ci spadła poniżej {{
            states('sensor.redmi_note_5_battery_level') }} procent. Podładuj
            sobie
          entity_id: media_player.nest_mini
      - action: notify.mobile_app_redmi_note_5
        data:
          message: TTS
          title: Iwona, bateria ci się kończy, podładuj sobie
          data:
            channel: alarm_stream_max
    mode: single

  - id: "1617115926500"
    alias: Powiadomienie o angielskim
    description: ""
    trigger:
      - trigger: time
        at: "18:00"
    condition: []
    action:
      # - action: notify.mobile_app_ta_1004
      #   data:
      #     message: TTS
      #     title: Kochana Hanusiu, czas na angielski! Zrób proszę lekcje ładnie, bez
      #       marudzenia!
      #     data:
      #       channel: alarm_stream_max
