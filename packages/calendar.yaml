template:
  - sensor:
      - default_entity_id: sensor.today_events
        icon: mdi:calendar
        attributes:
          location: "{{ state_attr('calendar.anarion_dunedain', 'location') }}"
          description:
            "{{ state_attr('calendar.anarion_dunedain', 'description')
            }}"
        name: Dzisiejsze wydarzenia
        state: "{{ state_attr('calendar.anarion_dunedain', 'message') }}"
