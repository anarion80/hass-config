tts:
  - platform: google_translate
    cache: true
    cache_dir: /tmp/tts
    time_memory: 300
    service_name: google_say

  - platform: google_cloud
    key_file: HA TTS-ebc33a850811.json
    language: pl-PL
    gender: female
    voice: pl-PL-Wavenet-A
    encoding: mp3
    text_type: ssml
    service_name: google_cloud_say
    profiles:
      - large-home-entertainment-class-device

script:
  quick_tts:
    alias: "Quick TTS"
    fields:
      message:
        description: "Message to speak"
        example: "Hello world"
        required: true
        selector:
          text:
      media_player:
        description: "Media player to use"
        example: "media_player.nest_mini"
        required: true
        selector:
          entity:
            domain: media_player
    sequence:
      - action: tts.speak
        data:
          media_player_entity_id: "{{ media_player }}"
          message: "{{ message }}"
        target:
          entity_id: tts.google_cloud_2
